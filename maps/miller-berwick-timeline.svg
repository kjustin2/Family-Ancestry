<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc">
  <title id="title">Berwick Miller family checkpoints, 1910 to 2019</title>
  <desc id="desc">Two sequence lanes distinguish census, marriage and yearbook records from Paulene's memoir, diary and a family notice. The record lane marks Wilbur in 1910, Lester and Velma's 1937 marriage, Marqueen in the 1940 household, and her 1956 yearbook. The family voice lane marks Paulene's 1941 birth, a recalled 1954 house sale, a 1983 Utah visit and a 2019 notice naming Marqueen Kitta. Spacing is not proportional to elapsed time.</desc>
  <rect width="1120" height="470" rx="18" fill="#f8f6f1"/>
  <text x="42" y="54" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#173447">Berwick Millers: one household, many decades</text>
  <text x="42" y="83" font-family="Arial,sans-serif" font-size="16" fill="#59666b">Records above · family recollections and notices below · sequence, not proportional time</text>
  <rect x="40" y="110" width="1040" height="142" rx="14" fill="#e2eff1"/>
  <rect x="40" y="266" width="1040" height="143" rx="14" fill="#f7ecde"/>
  <text x="61" y="145" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#176269">RECORDS</text>
  <text x="61" y="302" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#825225">FAMILY VOICES</text>
  <line x1="242" y1="185" x2="982" y2="185" stroke="#3b8d91" stroke-width="4"/>
  <line x1="242" y1="342" x2="982" y2="342" stroke="#bb874d" stroke-width="4"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g fill="#19747a"><circle cx="270" cy="185" r="10"/><circle cx="485" cy="185" r="10"/><circle cx="730" cy="185" r="10"/><circle cx="975" cy="185" r="10"/></g>
    <g fill="#985e2c"><circle cx="270" cy="342" r="10"/><circle cx="485" cy="342" r="10"/><circle cx="730" cy="342" r="10"/><circle cx="975" cy="342" r="10"/></g>
    <g fill="#18545b" font-size="17" font-weight="700"><text x="270" y="169">1910</text><text x="485" y="169">1937</text><text x="730" y="169">1940</text><text x="975" y="169">1956</text></g>
    <g fill="#825225" font-size="17" font-weight="700"><text x="270" y="326">1941</text><text x="485" y="326">c. 1954</text><text x="730" y="326">1983</text><text x="975" y="326">2019</text></g>
    <g fill="#304e57" font-size="15"><text x="270" y="220">Wilbur in census</text><text x="485" y="220">Lester + Velma</text><text x="730" y="220">Marqueen at home</text><text x="975" y="220">Marqueen yearbook</text></g>
    <g fill="#674c37" font-size="15"><text x="270" y="378">Paulene born</text><text x="485" y="378">House-sale memory</text><text x="730" y="378">Parents visit Utah</text><text x="975" y="378">Marqueen Kitta</text></g>
  </g>
  <text x="42" y="446" font-family="Arial,sans-serif" font-size="14" fill="#56636d">Sources and discrepancies: branches/miller-berwick-timeline.md · Wilbur’s death day and Fairview house number need originals.</text>
</svg>
