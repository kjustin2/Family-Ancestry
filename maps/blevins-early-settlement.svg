<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="420" viewBox="0 0 1080 420" role="img" aria-labelledby="title desc">
  <title id="title">Early Blevins sightings across Maryland and Virginia</title>
  <desc id="desc">Three separate horizontal lanes show the 1733 Maryland James, a James selling Goochland land in 1743 to 1745 and the Smith River hunters, and the 1772 Peach Bottom landholder. Question marks show that these sightings have not been linked as one person or to Ashley's confirmed line.</desc>
  <rect width="1080" height="420" fill="#f6f3eb"/>
  <rect x="0" width="12" height="420" fill="#b46827"/>
  <text x="46" y="47" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#163348">Which James was on Virginia's frontier?</text>
  <text x="46" y="77" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#52616a">A timeline of sightings, with identity gaps kept visible</text>
  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="44" y="105" width="992" height="74" rx="12" fill="#fff" stroke="#d8dedc"/>
    <rect x="44" y="105" width="7" height="74" rx="3" fill="#9b7955"/>
    <text x="69" y="133" font-size="18" font-weight="700" fill="#163348">1733 · Maryland Monocacy</text>
    <text x="69" y="159" font-size="16" fill="#52616a">James and Daniel Blavin appear in a tax-list transcription</text>
    <rect x="852" y="122" width="154" height="37" rx="18" fill="#eee6d9"/>
    <text x="929" y="147" font-size="14" text-anchor="middle" fill="#634d35">identity open</text>
    <path d="M541 180v20" stroke="#9b7955" stroke-width="3" stroke-dasharray="5 6"/>
    <text x="551" y="198" font-size="16" fill="#9b7955">?</text>
    <rect x="44" y="204" width="992" height="74" rx="12" fill="#fff" stroke="#d8dedc"/>
    <rect x="44" y="204" width="7" height="74" rx="3" fill="#b46827"/>
    <text x="69" y="232" font-size="18" font-weight="700" fill="#163348">1743–1748 · Virginia Piedmont</text>
    <text x="69" y="258" font-size="16" fill="#52616a">A James sold Goochland land; James and Daniel hunted along Smith River</text>
    <rect x="852" y="221" width="154" height="37" rx="18" fill="#f3e4d5"/>
    <text x="929" y="246" font-size="14" text-anchor="middle" fill="#81501f">may be different men</text>
    <path d="M541 279v20" stroke="#9b7955" stroke-width="3" stroke-dasharray="5 6"/>
    <text x="551" y="297" font-size="16" fill="#9b7955">?</text>
    <rect x="44" y="303" width="992" height="74" rx="12" fill="#fff" stroke="#d8dedc"/>
    <rect x="44" y="303" width="7" height="74" rx="3" fill="#127f82"/>
    <text x="69" y="331" font-size="18" font-weight="700" fill="#163348">1772–1801 · Peach Bottom</text>
    <text x="69" y="357" font-size="16" fill="#52616a">James acquired a tract, settled on it, and was named as John's father in a lawsuit</text>
    <rect x="852" y="320" width="154" height="37" rx="18" fill="#e1eeee"/>
    <text x="929" y="345" font-size="14" text-anchor="middle" fill="#116b6e">case abstract</text>
    <text x="46" y="405" font-size="15" fill="#52616a">None of these James sightings is yet connected by a documented parent chain to Ashley.</text>
  </g>
</svg>
