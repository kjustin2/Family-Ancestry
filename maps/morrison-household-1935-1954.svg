<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 360" role="img" aria-labelledby="title desc">
<title id="title">Florence Morrison's household across four dated records</title>
<desc id="desc">A chronological diagram: Pennsylvania residence reported for 1935, Arlington household in 1940, Roscoe's death in 1947, Eleanor heading a Fairfax household in 1950, and Florence's Alexandria marriage in 1954. The reason for the move is unknown.</desc>
<rect width="1050" height="360" fill="#f6f3eb"/><rect x="0" width="12" height="360" fill="#127f82"/>
<text x="42" y="50" fill="#1b323c" font-size="29" font-family="Arial,sans-serif" font-weight="700">Florence’s early household: a documented path</text>
<text x="42" y="81" fill="#52616a" font-size="17" font-family="Arial,sans-serif">Places and family status come from censuses, death and marriage records.</text>
<path d="M104 199H934" stroke="#7a9c9e" stroke-width="5"/>
<g font-family="Arial,sans-serif" text-anchor="middle">
<circle cx="110" cy="199" r="10" fill="#127f82"/><text x="110" y="144" fill="#1b323c" font-size="19" font-weight="700">1935</text><text x="110" y="170" fill="#52616a" font-size="15">Pennsylvania</text><text x="110" y="238" fill="#52616a" font-size="14">reported in 1940</text>
<circle cx="315" cy="199" r="10" fill="#127f82"/><text x="315" y="144" fill="#1b323c" font-size="19" font-weight="700">1940</text><text x="315" y="170" fill="#52616a" font-size="15">Arlington, Virginia</text><text x="315" y="238" fill="#52616a" font-size="14">Roscoe, Eleanor + 6 children</text>
<circle cx="520" cy="199" r="10" fill="#b46827"/><text x="520" y="144" fill="#1b323c" font-size="19" font-weight="700">1947</text><text x="520" y="170" fill="#52616a" font-size="15">Roscoe dies, 44</text><text x="520" y="238" fill="#52616a" font-size="14">Florence about nine</text>
<circle cx="730" cy="199" r="10" fill="#127f82"/><text x="730" y="144" fill="#1b323c" font-size="19" font-weight="700">1950</text><text x="730" y="170" fill="#52616a" font-size="15">Fairfax County</text><text x="730" y="238" fill="#52616a" font-size="14">Eleanor + 7 children</text>
<circle cx="940" cy="199" r="10" fill="#127f82"/><text x="940" y="144" fill="#1b323c" font-size="19" font-weight="700">1954</text><text x="940" y="170" fill="#52616a" font-size="15">Alexandria</text><text x="940" y="238" fill="#52616a" font-size="14">Florence marries Garnett</text>
</g>
<rect x="42" y="280" width="966" height="49" rx="8" fill="#e7f0ee"/><text x="59" y="311" fill="#25464a" font-size="16" font-family="Arial,sans-serif">Movement and widowhood are documented; motives, income and inheritance are not established.</text>
</svg>
