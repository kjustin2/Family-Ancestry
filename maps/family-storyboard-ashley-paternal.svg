<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 670" role="img" aria-labelledby="title desc">
<title id="title">Ashley's paternal lines · Virginia work and a Fairfax home</title><desc id="desc">Weatherford / Neathery and Morrison / Hollinger meet with Garnett and Florence in 1954. Three generation bands compare dated work, assets and education across two branches. Colors distinguish recorded, family-reported and proposed details.</desc>
