<text x="25" y="43" class="title" id="visible-title">Ashley's paternal lines · Virginia work and a Fairfax home</text>
<text x="25" y="68" class="sub" >Weatherford / Neathery and Morrison / Hollinger meet with Garnett and Florence in 1954.</text>
