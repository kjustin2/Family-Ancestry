<rect class="card" x="579" y="151" width="516" height="132"/><rect class="proposed" x="579" y="151" width="6" height="132" rx="3"/><text x="596" y="176" class="person" >Thomas + Isophena · Indiana lead</text><text x="597" y="200" class="key" >WORK</text><text x="669" y="200" class="value" >Farmer in a probable 1900 household</text><text x="597" y="223" class="key" >ASSET</text><text x="669" y="223" class="value" >Farm owned with mortgage; no balance</text><text x="597" y="246" class="key" >SCHOOL</text><text x="669" y="246" class="value" >Children's schooling needs closer check</text><rect x="596" y="257" width="180" height="18" rx="9" fill="#eff2ed"/><text x="606" y="270" class="badge" >GRANDPARENT LINK PROPOSED</text>
<text x="27" y="302" class="band" >1930–1950 · Depression and widowhood</text>
