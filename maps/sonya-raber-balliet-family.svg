<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Sonya Raber's recorded maternal line and two family branches</title>
  <desc id="desc">The 1915 county biography names Edward and Jennie Sponenberg and their daughter Aletha. Shirley Raber's 2018 obituary names Aletha and William Kreischer as her parents and Sonya Balliet as her daughter. Justin supplies Melissa's and Raegan's later relationships. Fairchild is an unplaced family-memory lead, not Shirley's mother in the records.</desc>
  <rect width="1200" height="675" rx="20" fill="#f7f3ec"/>
  <g font-family="Arial,sans-serif" fill="#263840">
    <text x="36" y="47" font-size="27" font-weight="700">Sonya's maternal line comes into focus</text>
    <text x="36" y="73" font-size="15" fill="#53656a">Solid links above Sonya: 1915 biography, 1940 census and 2018 obituary · later branches: family account</text>
    <rect x="285" y="100" width="630" height="70" rx="13" fill="#f3dfcb" stroke="#b77b3b" stroke-width="2"/>
    <text x="310" y="128" font-size="19" font-weight="700">Edward J. Sponenberg + Jennie Mensinger</text>
    <text x="310" y="153" font-size="14">Berwick · daughter Aletha named in 1915 biography</text>
    <path d="M600 170 V190" stroke="#b77b3b" stroke-width="3"/>
    <rect x="285" y="190" width="630" height="70" rx="13" fill="#f3dfcb" stroke="#b77b3b" stroke-width="2"/>
    <text x="310" y="218" font-size="19" font-weight="700">Aletha Sponenberg + William H. Kreischer</text>
    <text x="310" y="243" font-size="14">Named as Shirley's parents in obituary and 1940 census</text>
    <path d="M600 260 V280" stroke="#b77b3b" stroke-width="3"/>
    <rect x="285" y="280" width="630" height="70" rx="13" fill="#f3dfcb" stroke="#b77b3b" stroke-width="2"/>
    <text x="310" y="308" font-size="19" font-weight="700">Shirley Yvonne Kreischer Raber · 1932–2018</text>
    <text x="310" y="333" font-size="14">Four children named in obituary; their father unconfirmed</text>
    <path d="M600 350 V370" stroke="#39877a" stroke-width="3"/>
    <rect x="405" y="370" width="390" height="68" rx="13" fill="#dceee9" stroke="#39877a" stroke-width="2"/>
    <text x="425" y="398" font-size="19" font-weight="700">Sonya Raber / Balliet</text>
    <text x="425" y="423" font-size="14">Named as Shirley's daughter in 2018</text>
    <path d="M600 438 V459 H286 V478 M600 459 H911 V478" fill="none" stroke="#39877a" stroke-width="3"/>
    <rect x="36" y="478" width="500" height="115" rx="15" fill="#e7eeff" stroke="#6b7db2" stroke-width="2"/>
    <text x="56" y="507" font-size="16" font-weight="700" fill="#51679d">WITH PAUL MILLER · FAMILY ACCOUNT</text>
    <text x="56" y="537" font-size="19" font-weight="700">Melissa Miller Kramer</text>
    <text x="56" y="562" font-size="14">Melissa + Paul Kramer → Justin Kramer</text>
    <rect x="568" y="478" width="596" height="115" rx="15" fill="#e2f0e4" stroke="#649c71" stroke-width="2"/>
    <text x="588" y="507" font-size="16" font-weight="700" fill="#447651">WITH FLOYD BALLIET · FAMILY ACCOUNT</text>
    <text x="588" y="537" font-size="19" font-weight="700">Raegan Balliet Knight</text>
    <text x="588" y="562" font-size="14">Raegan + Robert Knight → Robert Knight Jr.</text>
    <rect x="36" y="614" width="1128" height="39" rx="8" fill="#fffaf4" stroke="#d8b48b" stroke-dasharray="5 4"/>
    <text x="52" y="639" font-size="14">Fairchild: remembered family name, but Shirley's recorded mother was Aletha Sponenberg. Its place in the tree is open.</text>
  </g>
</svg>
