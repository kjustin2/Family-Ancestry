<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Sonya Raber's Miller and Balliet family branches</title>
  <desc id="desc">Family-supplied relationships: Shirley Kreisher Raber is Sonya's mother, and Shirley's mother was born Fairchild. Sonya and Paul Miller are Melissa Miller Kramer's parents. Sonya and husband Floyd Balliet are Raegan Balliet's parents. Raegan married Robert Knight and has a son Robert Knight Junior. No recent relationships have yet been verified in an original record.</desc>
