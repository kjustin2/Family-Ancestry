<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="710" viewBox="0 0 1050 710" role="img" aria-labelledby="title desc"><title id="title">Recorded Kramer work in Wilkes-Barre</title><desc id="desc">A dated sequence of occupations from directories, censuses, Emil Carl Kramers signed draft card, marriage and enlistment records, obituary and family account. Money labels compare separate 1939 wage reports and a 1940 home estimate or rent; they are not net worth.</desc><rect width="1050" height="710" fill="#f6f3eb"/><rect x="0" y="0" width="12" height="710" fill="#127f82"/><text x="52" y="59" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#163348" >Work recorded along the Wilkes-Barre line</text><text x="52" y="89" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#52616a" >Different people and sources; this is a sequence of records, not one continuous job.</text><rect x="52" y="115" width="946" height="78" rx="12" fill="#fff" stroke="#d8dedc"/><rect x="52" y="115" width="155" height="78" rx="12" fill="#127f82"/><text x="129" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">1871–1900</text><text x="230" y="144" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#163348" >Matthew / Matthias</text><text x="230" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#163348" >mason → laborer → ropemaker</text><text x="976" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#52616a" text-anchor="end">city directories; identity proposed</text><rect x="52" y="207" width="946" height="78" rx="12" fill="#fff" stroke="#d8dedc"/><rect x="52" y="207" width="155" height="78" rx="12" fill="#127f82"/><text x="129" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">1889–1904</text><text x="230" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#163348" >Same-address Kramers</text><text x="230" y="262" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#163348" >silk beamer · book sewer · dressmaker · bottler</text><text x="976" y="234" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#52616a" text-anchor="end">directories; kinship unproved</text><rect x="52" y="299" width="946" height="78" rx="12" fill="#fff" stroke="#d8dedc"/><rect x="52" y="299" width="155" height="78" rx="12" fill="#127f82"/><text x="129" y="344" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">1940</text><text x="230" y="328" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#163348" >Ferdinand (c. 1882)</text><text x="230" y="354" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#163348" >wire-rope foreman · $1,996 wages in 1939</text><text x="976" y="326" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#52616a" text-anchor="end">census; owned home estimated $2,400</text><rect x="52" y="391" width="946" height="78" rx="12" fill="#fff" stroke="#d8dedc"/><rect x="52" y="391" width="155" height="78" rx="12" fill="#127f82"/><text x="129" y="436" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">1940–43</text><text x="230" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#163348" >Emil Carl (1915)</text><text x="230" y="446" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#163348" >ACCO strander → Army enlistment</text><text x="976" y="418" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#52616a" text-anchor="end">draft card; marriage; enlistment</text><rect x="52" y="483" width="946" height="78" rx="12" fill="#fff" stroke="#d8dedc"/><rect x="52" y="483" width="155" height="78" rx="12" fill="#127f82"/><text x="129" y="528" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">1936–50</text><text x="230" y="512" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#163348" >Ferdinand Louis (1913)</text><text x="230" y="538" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#163348" >machinist apprentice → Hazard wire-rope operator</text><text x="976" y="510" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#52616a" text-anchor="end">1939 wages ~$2,000; rent $5/month</text><rect x="52" y="575" width="946" height="78" rx="12" fill="#fff" stroke="#d8dedc"/><rect x="52" y="575" width="155" height="78" rx="12" fill="#127f82"/><text x="129" y="620" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Later</text><text x="230" y="604" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#163348" >Fred (1939) and Paul</text><text x="230" y="630" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#163348" >Techneglas / Army Reserve; Army Reserve</text><text x="976" y="602" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#52616a" text-anchor="end">Fred obituary / Paul family account</text><text x="52" y="690" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#52616a" >1939 wages belong to separate households; rent and home value are different measures, not net worth.</text></svg>