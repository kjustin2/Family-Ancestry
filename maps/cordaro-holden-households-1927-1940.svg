<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">Two Cordaro door numbers on Holden Street, 1927 to 1940</title>
  <desc id="desc">Antonio listed 438 Holden in 1927. In 1940 Mamie and brother John were recorded at 438, while Joseph and Dina rented at 440. Mamie's precise relationship to Antonio and the buildings' histories remain open.</desc>
  <rect width="1200" height="410" rx="20" fill="#f6f4ee"/>
  <rect width="11" height="410" fill="#287e77"/>
  <g font-family="Arial,sans-serif">
    <text x="36" y="47" font-size="29" font-weight="700" fill="#193e44">Cordaro households on Holden Street</text>
    <text x="36" y="76" font-size="16" fill="#52676a">One address in Antonio's 1927 petition; two neighboring entries in the 1940 census</text>
    <rect x="36" y="111" width="320" height="198" rx="14" fill="#fff" stroke="#c9dbd5" stroke-width="2"/>
    <text x="55" y="143" font-size="14" font-weight="700" fill="#27766e">1927 · SIGNED PETITION</text>
    <text x="55" y="182" font-size="26" font-weight="700" fill="#193e44">438 Holden</text>
    <text x="55" y="218" font-size="16" fill="#455b61">Antonio + wife Pietra</text>
    <text x="55" y="244" font-size="14" fill="#455b61">Five children named on form</text>
    <text x="55" y="284" font-size="13" fill="#8b6137">Ownership not stated</text>
    <path d="M356 211 H421" fill="none" stroke="#b17b41" stroke-width="4" stroke-dasharray="8 6"/>
    <rect x="421" y="111" width="350" height="198" rx="14" fill="#fff" stroke="#c9dbd5" stroke-width="2"/>
    <text x="440" y="143" font-size="14" font-weight="700" fill="#27766e">1940 · CENSUS, LINES 11–12</text>
    <text x="440" y="182" font-size="26" font-weight="700" fill="#193e44">438 Holden</text>
    <text x="440" y="218" font-size="16" fill="#455b61">Mamie + brother John Cordaro</text>
    <text x="440" y="244" font-size="14" fill="#455b61">Marked owned · reported $2,000 value</text>
    <text x="440" y="284" font-size="13" fill="#8b6137">Their link to Antonio needs a parent record</text>
    <path d="M771 211 H824" fill="none" stroke="#287e77" stroke-width="4"/>
    <rect x="824" y="111" width="340" height="198" rx="14" fill="#e7f1ec" stroke="#91bcb0" stroke-width="2"/>
    <text x="843" y="143" font-size="14" font-weight="700" fill="#27766e">1940 · CENSUS, LINES 13–14</text>
    <text x="843" y="182" font-size="26" font-weight="700" fill="#193e44">440 Holden</text>
    <text x="843" y="218" font-size="16" fill="#455b61">Joseph + Dina Cordaro</text>
    <text x="843" y="244" font-size="14" fill="#455b61">Marked rented · $15 per month</text>
    <text x="843" y="284" font-size="13" fill="#27766e">Patricia was born after this enumeration</text>
    <rect x="36" y="333" width="1128" height="48" rx="10" fill="#eee9db"/>
    <text x="53" y="362" font-size="13" fill="#455b61">A two-family parcel is pictured at 438 today; a deed or building card must join that structure to either 1940 address.</text>
  </g>
</svg>
