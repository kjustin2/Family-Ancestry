<title id="title">Rhode Island Blevins evidence and open bridges</title><desc id="desc">Three separate early leads sit above Ashley's documented Blevins line. Dashed gaps show no proven relationship between the Westerly families, the 1771 Daniel land claim, the tested Nathan branch, and Ashley.</desc>
<style>text{font-family:Arial,sans-serif;fill:#17323b}.title{font-size:27px;font-weight:700}.sub{font-size:14px}.head{font-size:16px;font-weight:700}.body{font-size:13px}.chip{font-size:12px;font-weight:700}.box{fill:#f6f3e9;stroke:#6c8c91;stroke-width:2;rx:13}.firm{fill:#dceee9;stroke:#27745d}.gap{stroke:#ae7043;stroke-width:3;stroke-dasharray:7 7}.solid{stroke:#27745d;stroke-width:3}.muted{fill:#6a5261}</style>
<rect width="1040" height="480" fill="#f9faf7"/>
<text x="32" y="44" class="title">Westerly is a lead, not Ashley's proved origin</text><text x="32" y="70" class="sub">Three early clues are distinct. The orange dashed bridges require original parent or land records.</text>
<rect class="box" x="30" y="105" width="300" height="116"/><text x="48" y="133" class="head">1691 · Edward + Isabel Bliven</text><text x="48" y="158" class="body">Westerly marriage in 1915 genealogy</text><text x="48" y="181" class="body">Five reported children; originals pending</text><text x="48" y="204" class="chip muted">Early household, not an Ashley link</text>
<rect class="box" x="370" y="105" width="300" height="116"/><text x="388" y="133" class="head">1771 · Daniel Sr. + Daniel Jr.</text><text x="388" y="158" class="body">Virginia deed transcript: Westerly land claim</text><text x="388" y="181" class="body">Father–son stated; residence not proved</text><text x="388" y="204" class="chip muted">Original deed still to inspect</text>
<rect class="box" x="710" y="105" width="300" height="116"/><text x="728" y="133" class="head">2017 · Y-DNA comparison</text><text x="728" y="158" class="body">Reported Nathan line ↔ Westerly line</text><text x="728" y="181" class="body">Shared paternal ancestry suggested</text><text x="728" y="204" class="chip muted">Neither test identifies Ashley's ancestor</text>
<path d="M180 222V298 M520 222V298 M860 222V298" class="gap"/><text x="398" y="281" class="chip muted">MISSING FAMILY BRIDGES</text>
<rect class="box firm" x="155" y="312" width="335" height="107"/><text x="175" y="341" class="head">Separate older Ashley-line candidate</text><text x="175" y="367" class="body">Daniel + Elizabeth → Shubiel → William E.</text><text x="175" y="392" class="body">Original households support parts of this path</text>
<rect class="box firm" x="560" y="312" width="325" height="107"/><text x="580" y="341" class="head">Ashley’s documented recent line</text><text x="580" y="367" class="body">William Howard → Gladys → Alice</text><text x="580" y="392" class="body">William E. → Howard still needs proof</text>
<path d="M492 365H558" class="gap"/><text x="31" y="461" class="sub">Read the source limits: branches/blevins-rhode-island-lead.md · Shirley pp. 159–84 (PDF pages)</text>
