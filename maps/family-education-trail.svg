    <text x="441" y="509" font-size="20" font-weight="700">Hayfield High School</text>
    <text x="441" y="533" font-size="15">Alice Marie Smith Weatherford</text>
    <text x="441" y="575" font-size="12" fill="#8b673c">FAMILY ACCOUNT · GRADE 12 ON RETURN</text>

    <text x="818" y="509" font-size="20" font-weight="700">Virginia Tech</text>
    <text x="818" y="533" font-size="15">Ashley + uncle Timothy A. Smith</text>
    <text x="818" y="554" font-size="14">Ashley 2015–19 · Timothy c. 1980–89</text>
    <text x="818" y="575" font-size="12" fill="#197786">SHARED CAMPUS · FAMILY ACCOUNT</text>

    <text x="64" y="680" font-size="20" font-weight="700">Joseph Anthony Cordaro</text>
    <text x="64" y="704" font-size="15">H2 = two high-school years completed</text>
    <text x="64" y="746" font-size="12" fill="#197786">ORIGINAL CENSUS · SCHOOL UNNAMED</text>

    <text x="618" y="680" font-size="20" font-weight="700">Dina Caucci Cordaro</text>
    <text x="618" y="704" font-size="15">8 = eighth grade completed</text>
    <text x="618" y="746" font-size="12" fill="#197786">ORIGINAL CENSUS · SCHOOL UNNAMED</text>
  </g>
  <text x="42" y="816" fill="#526a6e" font-family="Arial,sans-serif" font-size="14">School mentions and census grade codes do not establish degrees. Dates and identity checks are in the education guide.</text>
