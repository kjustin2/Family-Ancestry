<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Named schools and learning milestones in three family lines</title>
  <desc id="desc">Three family lanes show G.A.R., Coughlin, Berwick, Edison, Hayfield and Virginia Tech connections, with badges distinguishing yearbook OCR, obituary or memoir accounts, family reports and an alumni-index lead.</desc>
  <rect width="1200" height="680" rx="26" fill="#f7f3eb"/>
  <text x="38" y="45" fill="#19373d" font-family="Arial,sans-serif" font-size="28" font-weight="700">Where did they learn?</text>
  <text x="38" y="73" fill="#526a6e" font-family="Arial,sans-serif" font-size="15">Shared schools, named campuses and later study · source type shown on each card</text>

  <rect x="30" y="100" width="1140" height="162" rx="18" fill="#e9f0ed"/>
  <rect x="30" y="271" width="1140" height="162" rx="18" fill="#f2eadf"/>
  <rect x="30" y="442" width="1140" height="162" rx="18" fill="#eaeaf2"/>
  <g font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1" fill="#526a6e">
    <text x="48" y="125">KRAMER · WILKES-BARRE</text>
    <text x="48" y="296">MILLER / RABER · BERWICK</text>
    <text x="48" y="467">WEATHERFORD / SMITH · FAIRFAX TO BLACKSBURG</text>
  </g>

  <g stroke-width="2">
    <rect x="48" y="139" width="350" height="105" rx="15" fill="#fffefa" stroke="#197786"/>
    <rect x="425" y="139" width="350" height="105" rx="15" fill="#fffefa" stroke="#d2dcd8"/>
    <rect x="802" y="139" width="350" height="105" rx="15" fill="#fffefa" stroke="#b98a51" stroke-dasharray="7 5"/>

    <rect x="48" y="310" width="350" height="105" rx="15" fill="#fffefa" stroke="#197786"/>
    <rect x="425" y="310" width="350" height="105" rx="15" fill="#fffefa" stroke="#d2dcd8"/>
    <rect x="802" y="310" width="350" height="105" rx="15" fill="#fffefa" stroke="#d2dcd8"/>

    <rect x="48" y="481" width="350" height="105" rx="15" fill="#fffefa" stroke="#b98a51" stroke-dasharray="7 5"/>
    <rect x="425" y="481" width="350" height="105" rx="15" fill="#fffefa" stroke="#b98a51" stroke-dasharray="7 5"/>
    <rect x="802" y="481" width="350" height="105" rx="15" fill="#fffefa" stroke="#197786" stroke-dasharray="7 5"/>
  </g>

  <g font-family="Arial,sans-serif" fill="#19373d">
    <text x="64" y="167" font-size="20" font-weight="700">G.A.R. Memorial High</text>
    <text x="64" y="191" font-size="15">Hilda · Commercial, 1940</text>
    <text x="64" y="212" font-size="15">Ferdinand Louis · obituary</text>
    <text x="64" y="233" font-size="12" fill="#197786">YEARBOOK OCR + OBITUARIES</text>

    <text x="441" y="167" font-size="20" font-weight="700">National Radio Institute</text>
    <text x="441" y="191" font-size="15">Ferdinand Louis · later study</text>
    <text x="441" y="233" font-size="12" fill="#8b673c">OBITUARY ACCOUNT · DATE UNKNOWN</text>

    <text x="818" y="167" font-size="20" font-weight="700">Coughlin High School</text>
    <text x="818" y="191" font-size="15">Paul Joseph · 1982 name match</text>
    <text x="818" y="233" font-size="12" fill="#8b673c">ALUMNI INDEX LEAD · YEARBOOK NEEDED</text>

    <text x="64" y="338" font-size="20" font-weight="700">Berwick High School</text>
    <text x="64" y="362" font-size="15">Marqueen Miller · 1956 portrait</text>
    <text x="64" y="404" font-size="12" fill="#197786">DIGITIZED YEARBOOK PAGE</text>

    <text x="441" y="338" font-size="20" font-weight="700">Millville school year</text>
    <text x="441" y="362" font-size="15">Paulene Miller · mid-1950s</text>
    <text x="441" y="404" font-size="12" fill="#8b673c">FIRST-PERSON MEMOIR · SCHOOL UNNAMED</text>

    <text x="818" y="338" font-size="20" font-weight="700">GED, 1987</text>
    <text x="818" y="362" font-size="15">Shirley Kreischer Raber</text>
    <text x="818" y="404" font-size="12" fill="#8b673c">FAMILY OBITUARY · LATER CREDENTIAL</text>

    <text x="64" y="509" font-size="20" font-weight="700">Edison High School</text>
    <text x="64" y="533" font-size="15">John Gordon Weatherford</text>
    <text x="64" y="575" font-size="12" fill="#8b673c">FAMILY ACCOUNT · GRADE 12 ON RETURN</text>

    <text x="441" y="509" font-size="20" font-weight="700">Hayfield High School</text>
    <text x="441" y="533" font-size="15">Alice Marie Smith Weatherford</text>
    <text x="441" y="575" font-size="12" fill="#8b673c">FAMILY ACCOUNT · GRADE 12 ON RETURN</text>

    <text x="818" y="509" font-size="20" font-weight="700">Virginia Tech</text>
    <text x="818" y="533" font-size="15">Ashley + uncle Timothy A. Smith</text>
    <text x="818" y="575" font-size="12" fill="#197786">SHARED CAMPUS · FAMILY ACCOUNT</text>
  </g>
  <text x="42" y="645" fill="#526a6e" font-family="Arial,sans-serif" font-size="14">A school mention does not establish a degree. Dates and identity checks are in the education guide.</text>
</svg>
