<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 710" role="img" aria-labelledby="title desc">
  <title id="title">Two Williams, four siblings and Ruth's Fairchild marriage lead</title>
  <desc id="desc">A 1915 biography links John Kreischer to Henry to William H. Senior, then names Ruth Elizabeth, William Henry, Richard Stuart and Mary Dorcas as William and Bertha's children. A burial listing strongly matches Ruth to a later Fairchild surname. A dashed identity link shows that William Henry born 1909 may be Shirley's father William H. Junior.</desc>
  <rect width="1320" height="710" rx="24" fill="#f8f5ef"/>
  <g font-family="Arial,sans-serif">
    <text x="38" y="47" fill="#193745" font-size="28" font-weight="700">Two Williams — and where Fairchild fits</text>
    <text x="38" y="76" fill="#516b79" font-size="16">One 1915 biography names the household; later records help test two identities.</text>
    <text x="38" y="114" fill="#287058" font-size="16" font-weight="700">EARLIER GENERATIONS · 1915 COUNTY BIOGRAPHY</text>
    <g fill="#e9f1ed" stroke="#86ad9e" stroke-width="2">
      <rect x="38" y="130" width="370" height="102" rx="14"/>
      <rect x="475" y="130" width="370" height="102" rx="14"/>
      <rect x="912" y="130" width="370" height="102" rx="14"/>
    </g>
    <g fill="#193745" font-size="20" font-weight="700">
      <text x="57" y="163">John Kreischer (1809–1896)</text>
      <text x="494" y="163">Henry Kreischer (born 1857)</text>
      <text x="931" y="163">William H. Sr. (born 1878)</text>
    </g>
    <g fill="#516b79" font-size="15">
      <text x="57" y="191">80-acre farm + limestone quarry reported</text>
      <text x="494" y="191">Mary Strausser · farm + timber cutting</text>
      <text x="931" y="191">Bertha Stuart · railroad → car works</text>
    </g>
    <g stroke="#4b8a75" stroke-width="3" fill="none"><path d="M409 181 H473"/><path d="M846 181 H910"/><path d="M1097 233 V270 H184"/><path d="M1097 270 H1134"/><path d="M184 270 V311"/><path d="M500 270 V311"/><path d="M817 270 V311"/><path d="M1134 270 V311"/></g>
    <g fill="#287058" font-size="25" font-weight="700"><text x="427" y="189">→</text><text x="864" y="189">→</text></g>
    <text x="38" y="260" fill="#287058" font-size="16" font-weight="700">WILLIAM SR. + BERTHA'S FOUR CHILDREN · ALL NAMED IN 1915</text>
    <g fill="#fffefa" stroke="#b8d1c6" stroke-width="2">
      <rect x="38" y="313" width="291" height="114" rx="13"/>
      <rect x="355" y="313" width="291" height="114" rx="13"/>
      <rect x="672" y="313" width="291" height="114" rx="13"/>
      <rect x="989" y="313" width="291" height="114" rx="13"/>
    </g>
    <g fill="#193745" font-size="18" font-weight="700">
      <text x="54" y="346">Ruth Elizabeth</text>
      <text x="371" y="346">William Henry</text>
      <text x="688" y="346">Richard Stuart</text>
      <text x="1005" y="346">Mary Dorcas</text>
    </g>
    <g fill="#516b79" font-size="15">
      <text x="54" y="372">born 1907</text>
      <text x="371" y="372">born 1909 · possible William Jr.</text>
      <text x="688" y="372">born 1912</text>
      <text x="1005" y="372">born 1913</text>
    </g>
    <text x="54" y="401" fill="#8a653c" font-size="14" font-weight="700">Later Fairchild name: strong match</text>
    <text x="371" y="401" fill="#8a653c" font-size="14" font-weight="700">Identity bridge still open</text>
    <path d="M184 428 V463" fill="none" stroke="#ba864b" stroke-width="3" stroke-dasharray="8 6"/>
    <path d="M500 428 V463" fill="none" stroke="#ba864b" stroke-width="3" stroke-dasharray="8 6"/>
    <rect x="38" y="464" width="596" height="125" rx="15" fill="#f6eddc" stroke="#ba864b" stroke-width="2"/>
    <rect x="672" y="464" width="608" height="125" rx="15" fill="#e9eef6" stroke="#6d8ab4" stroke-width="2"/>
    <text x="55" y="495" fill="#875c31" font-size="17" font-weight="700">Ruth E. Kreischer Fairchild (1907–2005)</text>
    <text x="55" y="523" fill="#193745" font-size="15">Derivative burial listing: Pine Grove Cemetery Annex, Berwick.</text>
    <text x="55" y="550" fill="#516b79" font-size="14">Marriage record and husband's name still needed.</text>
    <text x="689" y="495" fill="#466899" font-size="17" font-weight="700">William H. Jr. + Aletha Sponenberg</text>
    <text x="689" y="523" fill="#193745" font-size="15">1940 household → daughter Shirley Kreischer Raber.</text>
    <text x="689" y="550" fill="#516b79" font-size="14">A parent-naming record must confirm the 1909 match.</text>
    <rect x="38" y="609" width="1242" height="55" rx="11" fill="#e7ece8"/>
    <text x="54" y="631" fill="#193745" font-size="15" font-weight="700">If William Henry = William Jr., Ruth was Shirley's paternal aunt; Fairchild entered through marriage.</text>
    <text x="54" y="650" fill="#516b79" font-size="13">The earlier family memory of a Fairchild-born great-grandmother is a separate unresolved question.</text>
    <text x="38" y="691" fill="#516b79" font-size="13">Sources: 1915 Columbia–Montour biography pp. 1204–05; 1940 Berwick census; Corey Kreischer obituary (2023); PeopleLegacy Ruth burial listing.</text>
  </g>
</svg>
