<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
  <title id="title">The Kennedys' recorded move from Ireland to Parsons</title>
  <desc id="desc">The 1900 census records Edward and Mary Kennedy as born in Ireland and reporting arrival around 1881 or 1882. Their eight children were born in Pennsylvania; Edward mined coal in Parsons. No county of origin, ship or reason for migration is documented.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#357b75"/></marker></defs>
  <rect width="900" height="260" fill="#f5f2eb"/>
  <text x="31" y="43" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#17364a">A Kennedy migration, as reported in 1900</text>
  <a href="../sources/records/edward-mary-kennedy-census-1900-sheet-22a.jpg"><rect x="31" y="70" width="281" height="131" rx="12" fill="#fff" stroke="#c3d3cf" stroke-width="2"/><text x="49" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#17364a">Ireland</text><text x="49" y="135" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#26484f">Edward + Mary were born here</text><text x="49" y="166" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#65727a">County and earlier lives unknown</text></a>
  <line x1="319" y1="135" x2="370" y2="135" stroke="#357b75" stroke-width="3" marker-end="url(#arrow)"/><text x="345" y="112" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#526974">c. 1881–82*</text>
  <a href="../sources/records/edward-mary-kennedy-census-1900-sheet-22b.jpg"><rect x="382" y="70" width="488" height="131" rx="12" fill="#fff" stroke="#c3d3cf" stroke-width="2"/><text x="400" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#17364a">Parsons, Pennsylvania · 1900</text><text x="400" y="135" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#26484f">Eight Pennsylvania-born children; Edward mined coal</text><text x="400" y="166" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#65727a">Daughter Mary A. is a strong match to Mary Kennedy Andrews</text></a>
  <text x="31" y="236" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#526974">* Census arrival years are recollections; no passenger record or personal reason for leaving has been found.</text>
</svg>
