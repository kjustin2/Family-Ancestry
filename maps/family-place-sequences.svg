  <text x="38" y="80" font-family="Arial,sans-serif" font-size="16" fill="#596970">Town centers only · dashed paths mean missing move dates · panels have different scales</text>
  <rect x="34" y="105" width="690" height="405" rx="16" fill="#e9f0ef"/>
  <rect x="742" y="105" width="404" height="405" rx="16" fill="#efeaf1"/>
