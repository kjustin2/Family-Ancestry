<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="615" viewBox="0 0 1180 615" role="img" aria-labelledby="title desc">
  <title id="title">Family place sequences: Pennsylvania and Virginia</title>
  <desc id="desc">Approximate town-center maps show the maternal Muncy Valley to Berwick to Muncy regional sequence, the paternal Wilkes-Barre to Muncy generational connection, Cordaro West Wyoming evidence, and the Weatherford Danville to Franconia sequence. Dashes indicate unknown move dates and routes. The Pennsylvania and Virginia panels use different scales. No living home is pinned.</desc>
  <defs>
    <marker id="gold-tip" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L9 5 0 10Z" fill="#b36a20"/></marker>
    <marker id="teal-tip" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L9 5 0 10Z" fill="#177783"/></marker>
    <marker id="violet-tip" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L9 5 0 10Z" fill="#725a99"/></marker>
  </defs>
  <rect width="1180" height="615" rx="22" fill="#f7f6f2"/>
