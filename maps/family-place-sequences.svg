    <text x="766" y="140" font-size="20" font-weight="700" fill="#493d5d">Virginia · southern to northern</text>
    <text x="54" y="485" font-size="13" fill="#64767b">West ← approximate geography → East</text>
    <text x="766" y="485" font-size="13" fill="#71677b">Locations are approximate, not a road route</text>
