<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="805" viewBox="0 0 1100 805" role="img" aria-labelledby="title desc"><title id="title">Kramer working lineage</title><desc id="desc">Six people from Matthew Kramer to Justin Kramer. Two early parent-child links are proposed; three successive Ferdinand generations have distinct labels.</desc><rect width="1100" height="805" fill="#f6f3eb"/><rect x="0" y="0" width="12" height="805" fill="#127f82"/><text x="54" y="62" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#163348" >The Kramer names, one generation at a time</text><text x="54" y="93" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#52616a" >Solid = recorded or family-supplied link     Dashed = chart/proposed link</text><rect x="54" y="124" width="990" height="73" rx="13" fill="#fff" stroke="#d8dedc"/><rect x="54" y="124" width="8" height="73" rx="4" fill="#547487"/><text x="85" y="155" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#163348" >Matthew / Matthias Kramer</text><text x="85" y="181" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#52616a" >charted 1840–1918 · mason, later ropemaker</text><rect x="850" y="142" width="165" height="35" rx="17" fill="#547487"/><text x="932" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">CHART / INDEX</text><line x1="102" y1="197" x2="102" y2="229" stroke="#127f82" stroke-width="3" stroke-dasharray="7 7"/><circle cx="102" cy="229" r="5" fill="#127f82"/><rect x="54" y="229" width="990" height="73" rx="13" fill="#fff" stroke="#d8dedc"/><rect x="54" y="229" width="8" height="73" rx="4" fill="#127f82"/><text x="85" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#163348" >Ferdinand (c. 1882)</text><text x="85" y="286" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#52616a" >older foreman · 146 Prospect · 1940 census</text><rect x="850" y="247" width="165" height="35" rx="17" fill="#127f82"/><text x="932" y="271" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">CENSUS</text><line x1="102" y1="302" x2="102" y2="334" stroke="#127f82" stroke-width="3" stroke-dasharray="7 7"/><circle cx="102" cy="334" r="5" fill="#127f82"/><rect x="54" y="334" width="990" height="73" rx="13" fill="#fff" stroke="#d8dedc"/><rect x="54" y="334" width="8" height="73" rx="4" fill="#127f82"/><text x="85" y="365" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#163348" >Ferdinand Louis (1913)</text><text x="85" y="391" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#52616a" >younger machine operator · 1950 census match</text><rect x="850" y="352" width="165" height="35" rx="17" fill="#127f82"/><text x="932" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">STRONG MATCH</text><line x1="102" y1="407" x2="102" y2="439" stroke="#b46827" stroke-width="3" stroke-dasharray="7 7"/><circle cx="102" cy="439" r="5" fill="#b46827"/><rect x="54" y="439" width="990" height="73" rx="13" fill="#fff" stroke="#d8dedc"/><rect x="54" y="439" width="8" height="73" rx="4" fill="#b46827"/><text x="85" y="470" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#163348" >Fred / Ferdinand Francis (1939)</text><text x="85" y="496" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#52616a" >Techneglas · Army Reserve · obituary</text><rect x="850" y="457" width="165" height="35" rx="17" fill="#b46827"/><text x="932" y="481" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">OBITUARY</text><line x1="102" y1="512" x2="102" y2="544" stroke="#5c6ba0" stroke-width="3"/><circle cx="102" cy="544" r="5" fill="#5c6ba0"/><rect x="54" y="544" width="990" height="73" rx="13" fill="#fff" stroke="#d8dedc"/><rect x="54" y="544" width="8" height="73" rx="4" fill="#5c6ba0"/><text x="85" y="575" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#163348" >Paul Joseph Kramer</text><text x="85" y="601" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#52616a" >Army Reserve · family account</text><rect x="850" y="562" width="165" height="35" rx="17" fill="#5c6ba0"/><text x="932" y="586" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">FAMILY</text><line x1="102" y1="617" x2="102" y2="649" stroke="#5c6ba0" stroke-width="3"/><circle cx="102" cy="649" r="5" fill="#5c6ba0"/><rect x="54" y="649" width="990" height="73" rx="13" fill="#fff" stroke="#d8dedc"/><rect x="54" y="649" width="8" height="73" rx="4" fill="#5c6ba0"/><text x="85" y="680" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#163348" >Justin Paul Kramer</text><text x="85" y="706" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#52616a" >son of Paul and Melissa Miller Kramer</text><rect x="850" y="667" width="165" height="35" rx="17" fill="#5c6ba0"/><text x="932" y="691" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">FAMILY</text><text x="54" y="774" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#52616a" >Open: Matthew → 1882 Ferdinand; 1882 → 1913 Ferdinand; 1913 record → Fred’s father.</text></svg>