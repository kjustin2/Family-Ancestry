<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="645" viewBox="0 0 1180 645" role="img" aria-labelledby="title desc"><title id="title">Melissa Miller Kramer’s Miller and Raber family lines</title><desc id="desc">Two Berwick branches join at Paul Miller and Sonya Raber, whose daughter is Melissa. The Miller branch uses Paulene Beach’s family memoir, censuses and Justin’s account. A 1915 biography, 1940 census and 2018 obituary support the Sponenberg, Kreischer and Raber line. A burial listing strongly matches Ruth Kreischer to Fairchild by marriage; the remembered direct ancestor remains unplaced.</desc><rect width="1180" height="645" fill="#f6f3eb"/><rect x="0" y="0" width="12" height="645" fill="#127f82"/><text x="48" y="56" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" fill="#163348" >Melissa’s two Berwick branches</text><text x="48" y="85" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#52616a" >Left: Miller memoir + census   ·   Right: 1915 biography, 1940 census + 2018 obituary</text><rect x="48" y="112" width="515" height="82" rx="12" fill="#fff" stroke="#d8dedc"/><rect x="48" y="112" width="8" height="82" rx="4" fill="#127f82"/><text x="70" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#163348" >Amos Miller + Mary Gower</text><text x="70" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#163348" >Lester’s parents · memoir dates 1867–1943 / 1884–1954</text><text x="70" y="183" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#52616a" >Family memoir; vital records pending</text><rect x="618" y="112" width="515" height="82" rx="12" fill="#fff" stroke="#d8dedc"/><rect x="618" y="112" width="8" height="82" rx="4" fill="#b46827"/><text x="640" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#163348" >Aletha Sponenberg + William Kreischer</text><text x="640" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#163348" >Aletha’s parents: Edward + Jennie Sponenberg</text><text x="640" y="183" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#52616a" >1915 biography; 1940 census; 2018 obituary</text><rect x="48" y="216" width="515" height="82" rx="12" fill="#fff" stroke="#d8dedc"/><rect x="48" y="216" width="8" height="82" rx="4" fill="#127f82"/><text x="70" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#163348" >Lester Miller + Mabel/Pearl Reese</text><text x="70" y="266" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#163348" >Mabel raised by William + Clementine Wilson</text><text x="70" y="287" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#52616a" >Memoir; six named children</text><rect x="618" y="216" width="515" height="82" rx="12" fill="#fff" stroke="#d8dedc"/><rect x="618" y="216" width="8" height="82" rx="4" fill="#b46827"/><text x="640" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#163348" >Shirley Kreischer Raber</text><text x="640" y="266" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#163348" >Daughter of Aletha + William · 1932–2018</text><text x="640" y="287" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#52616a" >1940 census and 2018 obituary</text><rect x="48" y="320" width="515" height="82" rx="12" fill="#fff" stroke="#d8dedc"/><rect x="48" y="320" width="8" height="82" rx="4" fill="#127f82"/><text x="70" y="346" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#163348" >Paul Miller</text><text x="70" y="370" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#163348" >Siblings: Marqueen, Paulene, Shirley, Gladys, Carl</text><text x="70" y="391" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#52616a" >Justin + Paulene’s memoir; Gladys lifespan disputed</text><rect x="618" y="320" width="515" height="82" rx="12" fill="#fff" stroke="#d8dedc"/><rect x="618" y="320" width="8" height="82" rx="4" fill="#b46827"/><text x="640" y="346" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#163348" >Sonya Raber / Balliet</text><text x="640" y="370" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#163348" >Siblings Bill, Tom, Wendy; Alice, Tim spouses</text><text x="640" y="391" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#52616a" >2018 obituary; Sonya’s father unconfirmed</text><line x1="304" y1="194" x2="304" y2="216" stroke="#85979b" stroke-width="3"/><line x1="304" y1="298" x2="304" y2="320" stroke="#85979b" stroke-width="3"/><line x1="874" y1="194" x2="874" y2="216" stroke="#85979b" stroke-width="3"/><line x1="874" y1="298" x2="874" y2="320" stroke="#85979b" stroke-width="3"/><path d="M304 402 L304 429 L590 429 M874 402 L874 429 L590 429 L590 449" fill="none" stroke="#85979b" stroke-width="3"/><rect x="310" y="449" width="560" height="82" rx="12" fill="#fff" stroke="#d8dedc"/><rect x="310" y="449" width="8" height="82" rx="4" fill="#5c6ba0"/><text x="332" y="475" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#163348" >Melissa Miller Kramer</text><text x="332" y="499" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#163348" >Daughter of Paul + Sonya · mother of Justin</text><text x="332" y="520" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#52616a" >Parent links supplied by Justin</text><text x="48" y="577" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#344954" >Earlier Miller, Reese and Corderman relatives appear in the branch page.</text><text x="48" y="607" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#52616a" >Ruth Kreischer Fairchild: strong burial lead; Shirley’s mother was Aletha Sponenberg.</text></svg>