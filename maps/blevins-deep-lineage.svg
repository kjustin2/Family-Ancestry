<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="930" viewBox="0 0 1120 930" role="img" aria-labelledby="title desc"><title id="title">Ashley Weatherford’s Blevins evidence ladder</title><desc id="desc">Eight layers from James Blevins circa 1708 to Ashley. Dashed connectors indicate proposed or ambiguous links. William Elkanah’s 1929 death record directly names Shubiel and Ada. The 1920 census suggests, but does not prove, William Howard as William Elkanah’s son. Original 1850 and 1860 households support Daniel and Elizabeth as likely parents of Shubiel. The 1880 sheet names Ada Thompson in-laws. The oldest colonial links are tree hypotheses.</desc><rect width="1120" height="930" fill="#f6f3eb"/><rect width="12" height="930" fill="#b46827"/><text x="52" y="55" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" fill="#163348" >How far does Ashley’s Blevins line go?</text><text x="52" y="85" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#52616a" >The color and connectors show what has actually been checked.</text><rect x="52" y="116" width="1016" height="74" rx="12" fill="#fff" stroke="#d8dedc"/><rect x="52" y="116" width="8" height="74" rx="4" fill="#9b7955"/><text x="78" y="145" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#163348" >James Blevins (c. 1708)</text><text x="78" y="171" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#52616a" >Earliest person in linked tree; no overseas birthplace</text><rect x="901" y="133" width="140" height="34" rx="17" fill="#9b7955"/><text x="971" y="156" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">TREE</text><line x1="101" y1="190" x2="101" y2="214" stroke="#9b7955" stroke-width="3" stroke-dasharray="7 7"/><rect x="52" y="214" width="1016" height="74" rx="12" fill="#fff" stroke="#d8dedc"/><rect x="52" y="214" width="8" height="74" rx="4" fill="#9b7955"/><text x="78" y="243" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#163348" >James Blevins (c. 1740)</text><text x="78" y="269" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#52616a" >Parentage disputed by Blevins researcher</text><rect x="901" y="231" width="140" height="34" rx="17" fill="#9b7955"/><text x="971" y="254" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">TREE</text><line x1="101" y1="288" x2="101" y2="312" stroke="#9b7955" stroke-width="3" stroke-dasharray="7 7"/><rect x="52" y="312" width="1016" height="74" rx="12" fill="#fff" stroke="#d8dedc"/><rect x="52" y="312" width="8" height="74" rx="4" fill="#9b7955"/><text x="78" y="341" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#163348" >Joseph Sr. (c. 1770) → Daniel (c. 1802)</text><text x="78" y="367" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#52616a" >Two proposed parent-child links; originals needed</text><rect x="901" y="329" width="140" height="34" rx="17" fill="#9b7955"/><text x="971" y="352" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">TREE</text><line x1="101" y1="386" x2="101" y2="410" stroke="#9b7955" stroke-width="3" stroke-dasharray="7 7"/><rect x="52" y="410" width="1016" height="74" rx="12" fill="#fff" stroke="#d8dedc"/><rect x="52" y="410" width="8" height="74" rx="4" fill="#547487"/><text x="78" y="439" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#163348" >Shubiel Blevins (1844–1913?)</text><text x="78" y="465" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#52616a" >1850 + 1860 households; Thompson in-laws; veteran</text><rect x="901" y="427" width="140" height="34" rx="17" fill="#547487"/><text x="971" y="450" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">MIXED</text><line x1="101" y1="484" x2="101" y2="508" stroke="#127f82" stroke-width="3"/><rect x="52" y="508" width="1016" height="74" rx="12" fill="#fff" stroke="#d8dedc"/><rect x="52" y="508" width="8" height="74" rx="4" fill="#127f82"/><text x="78" y="537" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#163348" >William Elkanah (1876–1929)</text><text x="78" y="563" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#52616a" >Death certificate names Shubiel + Ada Thompson</text><rect x="901" y="525" width="140" height="34" rx="17" fill="#127f82"/><text x="971" y="548" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">RECORD</text><line x1="101" y1="582" x2="101" y2="606" stroke="#9b7955" stroke-width="3" stroke-dasharray="7 7"/><rect x="52" y="606" width="1016" height="74" rx="12" fill="#fff" stroke="#d8dedc"/><rect x="52" y="606" width="8" height="74" rx="4" fill="#547487"/><text x="78" y="635" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#163348" >William Howard (c. 1908–1991?)</text><text x="78" y="661" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#52616a" >1920 Howard + William E. household; relationship open</text><rect x="901" y="623" width="140" height="34" rx="17" fill="#547487"/><text x="971" y="646" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">LEAD</text><line x1="101" y1="680" x2="101" y2="704" stroke="#127f82" stroke-width="3"/><rect x="52" y="704" width="1016" height="74" rx="12" fill="#fff" stroke="#d8dedc"/><rect x="52" y="704" width="8" height="74" rx="4" fill="#127f82"/><text x="78" y="733" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#163348" >Gladys Louise Blevins (1938–2008)</text><text x="78" y="759" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#52616a" >1940 census: William Howard + Mary Hines</text><rect x="901" y="721" width="140" height="34" rx="17" fill="#127f82"/><text x="971" y="744" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">RECORD</text><line x1="101" y1="778" x2="101" y2="802" stroke="#127f82" stroke-width="3"/><rect x="52" y="802" width="1016" height="74" rx="12" fill="#fff" stroke="#d8dedc"/><rect x="52" y="802" width="8" height="74" rx="4" fill="#547487"/><text x="78" y="831" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#163348" >Alice Smith → Ashley Weatherford</text><text x="78" y="857" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#52616a" >1986 marriage return + family account</text><rect x="901" y="819" width="140" height="34" rx="17" fill="#547487"/><text x="971" y="842" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">MIXED</text><rect x="52" y="911" width="1016" height="1" fill="#d8dedc"/><text x="52" y="891" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#52616a" >Open: William Howard’s birth/1910 record; Shubiel’s roster page; Joseph and both James links.</text></svg>