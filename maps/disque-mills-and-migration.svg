<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Disqué mill work and two separate Pennsylvania migration leads</title>
  <desc id="desc">The upper lane shows selected Palatinate mill events from Bernhard's 1684 rebuilding offer through the 1847 Knittelsheim estate notice, without implying a direct parent chain. The lower lane separates Magdalena Fröhlich Disque's 1864 migration card from Matthew and Lena Kramer's reported 1865 arrival in the 1900 census. A dashed question between them marks the unproved family connection.</desc>
  <rect width="1200" height="720" rx="24" fill="#f5f2e9"/>
  <rect x="0" y="0" width="12" height="720" fill="#2b7180"/>
  <g font-family="Arial,sans-serif">
    <text x="44" y="54" font-size="31" font-weight="700" fill="#193841">Mill leases, an estate, and a missing family bridge</text>
    <text x="44" y="82" font-size="16" fill="#53666a">The Palatinate mill story is documented; the link to Lena Kramer in Pennsylvania is still a question.</text>
    <rect x="40" y="110" width="1120" height="292" rx="18" fill="#e4eeea"/>
    <text x="60" y="143" font-size="17" font-weight="700" fill="#276c74">PALATINATE MILL NETWORK · selected events across branches</text>
    <g fill="#fffdfa" stroke="#3d8287" stroke-width="2">
      <rect x="62" y="175" width="230" height="185" rx="13"/>
      <rect x="338" y="175" width="230" height="185" rx="13"/>
      <rect x="614" y="175" width="230" height="185" rx="13"/>
      <rect x="890" y="175" width="230" height="185" rx="13"/>
    </g>
    <g font-size="24" font-weight="700" fill="#193841"><text x="80" y="211">1684</text><text x="356" y="211">1718</text><text x="632" y="211">c. 1768</text><text x="908" y="211">1847</text></g>
    <g font-size="16" fill="#294c52">
      <text x="80" y="240">Bernhard offers to</text><text x="80" y="262">rebuild a ruined mill</text>
      <text x="356" y="240">Sebastian Disqué</text><text x="356" y="262">marries Anna Barbara</text><text x="356" y="284">Schaaf, a miller's child</text>
      <text x="632" y="240">Johann Ludwig buys</text><text x="632" y="262">Knittelsheim mill</text>
      <text x="908" y="240">Sigmund's indivisible</text><text x="908" y="262">mill estate is offered</text><text x="908" y="284">for auction</text>
    </g>
    <g font-size="14" fill="#567276"><text x="80" y="333">Operating right, not rank</text><text x="356" y="333">Two miller families</text><text x="632" y="333">Land and equipment later</text><text x="908" y="333">Sale apparently failed</text></g>
    <rect x="40" y="424" width="1120" height="244" rx="18" fill="#fffdfa" stroke="#d7dcd6"/>
    <text x="60" y="458" font-size="17" font-weight="700" fill="#8d6530">TWO MIGRATION ACCOUNTS · NOT YET ONE PROVED FAMILY</text>
    <rect x="62" y="480" width="442" height="126" rx="12" fill="#f5ead8"/>
    <rect x="696" y="480" width="442" height="126" rx="12" fill="#e6f0ee"/>
    <text x="82" y="511" font-size="21" font-weight="700" fill="#624522">1864 · Magdalena Fröhlich Disque</text>
    <text x="82" y="538" font-size="16" fill="#584b3e">Migration card names four children leaving;</text>
    <text x="82" y="562" font-size="16" fill="#584b3e">the chart's Lena is not among them.</text>
    <text x="716" y="511" font-size="20" font-weight="700" fill="#214e58">1865 reported · Matthew and Lena</text>
    <text x="716" y="538" font-size="16" fill="#405d61">Their 1900 Wilkes-Barre census reports</text>
    <text x="716" y="562" font-size="16" fill="#405d61">German birth and 1865 arrival for both.</text>
    <path d="M505 542H692" stroke="#aa7b3c" stroke-width="3" stroke-dasharray="7 7"/>
    <rect x="537" y="514" width="122" height="52" rx="10" fill="#fffdfa" stroke="#aa7b3c"/>
    <text x="598" y="536" text-anchor="middle" font-size="14" font-weight="700" fill="#805c30">Missing Lena</text>
    <text x="598" y="554" text-anchor="middle" font-size="14" fill="#805c30">parent record</text>
    <text x="60" y="641" font-size="14" fill="#53666a">The 1864 card and 1900 census do not identify the same traveler; dates are evidence labels, not a voyage itinerary.</text>
    <text x="40" y="700" font-size="14" fill="#53666a">Sources and unresolved dates: branches/disque-schaaf.md · specialist Palatinate mill history · Institute migration cards · 1900 census</text>
  </g>
</svg>
