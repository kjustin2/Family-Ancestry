<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Two Cordaro households at number 440 in the 1950 census</title>
  <desc id="desc">The 1950 census records separate households headed by brothers John A. Cordaro and Joseph A. Cordaro at number 440. Each household has a daughter named Patricia. Joseph's 1962 marriage application names him and Dina Caucci as the parents of Patricia Kramer. Antoinette and Mary are named as Joseph and Dina's daughters in the census. John's daughters are Patricia and Joanna.</desc>
  <rect width="1400" height="620" rx="24" fill="#f3f5f1"/>
  <rect x="0" y="0" width="1400" height="12" fill="#287c74"/>
  <g font-family="Arial, sans-serif">
    <text x="48" y="62" font-size="34" font-weight="700" fill="#183d44">Two Patricias at number 440</text>
    <text x="48" y="98" font-size="19" fill="#4e676a">West Wyoming, Pennsylvania · April 1950 census · street label appears “Ensign St.”</text>
    <rect x="48" y="130" width="621" height="342" rx="18" fill="#ffffff" stroke="#bfd2cd" stroke-width="2"/>
    <rect x="731" y="130" width="621" height="342" rx="18" fill="#ffffff" stroke="#bfd2cd" stroke-width="2"/>
    <text x="77" y="173" font-size="18" font-weight="700" fill="#257269">DWELLING 70 · JOHN'S HOUSEHOLD</text>
    <text x="760" y="173" font-size="18" font-weight="700" fill="#257269">DWELLING 71 · JOSEPH'S HOUSEHOLD</text>
    <text x="77" y="221" font-size="27" font-weight="700" fill="#183d44">John A. Cordaro, 30</text>
    <text x="760" y="221" font-size="27" font-weight="700" fill="#183d44">Joseph A. Cordaro, 39</text>
    <text x="77" y="253" font-size="19" fill="#425b61">Anna E., 27 · wife</text>
    <text x="760" y="253" font-size="19" fill="#425b61">Dina M., 33 · wife</text>
    <text x="77" y="296" font-size="21" fill="#425b61">Patricia, 4 · Joanna, 2</text>
    <text x="760" y="296" font-size="21" fill="#425b61">Patricia A., 8 · Antoinette, 7 · Mary, 4</text>
    <rect x="77" y="328" width="558" height="76" rx="10" fill="#e8f3ef"/>
    <rect x="760" y="328" width="558" height="76" rx="10" fill="#e8f3ef"/>
    <text x="95" y="358" font-size="19" font-weight="700" fill="#1e5c56">John: lineman in construction</text>
    <text x="95" y="384" font-size="15" fill="#41645f">Same John/Mamie sibling pair likely at 438 in 1940</text>
    <text x="778" y="358" font-size="19" font-weight="700" fill="#1e5c56">Joseph: miner in mining</text>
    <text x="778" y="384" font-size="15" fill="#41645f">1962 application names Joseph + Dina as Patricia's parents</text>
    <text x="77" y="445" font-size="15" fill="#7a5a39">1950 census sheet 8, lines 29–30; sheet 9, lines 1–2</text>
    <text x="760" y="445" font-size="15" fill="#7a5a39">1950 census sheet 9, lines 3–7</text>
    <path d="M669 228 H731" stroke="#ae7544" stroke-width="3" stroke-dasharray="7 6"/>
    <text x="48" y="520" font-size="18" font-weight="700" fill="#183d44">Why the distinction matters</text>
    <text x="48" y="551" font-size="17" fill="#425b61">A name search for “Patricia Cordaro” can find the cousin. The parent names on the 1962 marriage application identify Justin's grandmother.</text>
    <text x="48" y="584" font-size="14" fill="#61767a">Source: U.S. 1950 census, Luzerne County ED 40-473, sheets 8–9. Street reading and modern address pin need another record.</text>
  </g>
</svg>
