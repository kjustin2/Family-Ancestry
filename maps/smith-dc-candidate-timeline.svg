<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="395" viewBox="0 0 1320 395" role="img" aria-labelledby="title desc">
  <title id="title">Smith family evidence in Washington, DC, 1917 to 1957</title>
  <desc id="desc">Five record boxes show Raymond Smith and Alice Mulhall's 1917 marriage index, original census sheets for 1930, 1940 and 1950, and a 1957 marriage-license notice joining a 24-year-old James Allen Smith to Gladys Louise Blevins. The notice does not name his parents, so the groom's identity as Raymond and Alice's son remains probable.</desc>
  <rect width="1320" height="395" fill="#f5f2e9"/>
  <rect width="8" height="395" fill="#98704d"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="30" y="42" font-size="28" font-weight="700" fill="#193a4e">A Smith family in Washington, DC</text>
    <text x="30" y="69" font-size="16" fill="#50616b">A 1957 license notice adds the missing spouse's name; the groom's parents still need direct proof.</text>
    <text x="30" y="116" font-size="14" fill="#5b6870">Source chain: 1917 marriage index · 1930–50 original censuses · 1957 newspaper original</text>
    <line x1="147" y1="138" x2="1171" y2="138" stroke="#7a9a9d" stroke-width="4"/>
    <g fill="#ffffff" stroke="#d5dfdd" stroke-width="1.5">
      <rect x="30" y="165" width="234" height="122" rx="12"/>
      <rect x="286" y="165" width="234" height="122" rx="12"/>
      <rect x="542" y="165" width="234" height="122" rx="12"/>
      <rect x="798" y="165" width="234" height="122" rx="12"/>
      <rect x="1054" y="165" width="234" height="122" rx="12"/>
    </g>
    <g fill="#537b82">
      <circle cx="147" cy="138" r="9"/><circle cx="403" cy="138" r="9"/>
      <circle cx="659" cy="138" r="9"/><circle cx="915" cy="138" r="9"/>
      <circle cx="1171" cy="138" r="9"/>
    </g>
    <g stroke="#7a9a9d" stroke-width="2">
      <line x1="147" y1="147" x2="147" y2="165"/>
      <line x1="403" y1="147" x2="403" y2="165"/>
      <line x1="659" y1="147" x2="659" y2="165"/>
      <line x1="915" y1="147" x2="915" y2="165"/>
      <line x1="1171" y1="147" x2="1171" y2="165"/>
    </g>
    <g fill="#173c50" font-weight="700" font-size="19">
      <text x="46" y="197">1917 · marriage</text><text x="302" y="197">1930 · census</text>
      <text x="558" y="197">1940 · census</text><text x="814" y="197">1950 · census</text>
      <text x="1070" y="197">1957 · license</text>
    </g>
    <g fill="#304e5d" font-size="14">
      <text x="46" y="225">Raymond J. Smith +</text><text x="46" y="246">Alice M. Mulhall</text><text x="46" y="267">Indexed DC entry</text>
      <text x="302" y="225">Four older children;</text><text x="302" y="246">Raymond is an optician</text><text x="302" y="267">Rented: $35.50/month</text>
      <text x="558" y="225">James A., 6, at home</text><text x="558" y="246">with Raymond, Alice</text><text x="558" y="267">and five older children</text>
      <text x="814" y="225">James A., 16, at home;</text><text x="814" y="246">Raymond again reports</text><text x="814" y="267">optician work</text>
      <text x="1070" y="225">James Allen Smith, 24</text><text x="1070" y="246">+ Gladys L. Blevins, 19</text><text x="1070" y="267">Original Star page C-9</text>
    </g>
    <line x1="1171" y1="300" x2="1171" y2="321" stroke="#a06c53" stroke-width="2" stroke-dasharray="6 5"/>
    <rect x="286" y="322" width="1002" height="50" rx="10" fill="#fff1e8" stroke="#d6ad94"/>
    <text x="302" y="344" font-size="16" font-weight="700" fill="#714a3a">Last identity check:</text>
    <text x="302" y="363" font-size="14" fill="#714a3a">The notice names the couple and fits the son's age, but does not name his parents. Seek the 1957 civil return.</text>
  </g>
</svg>
