  <text x="60" y="289" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#744524">SMITH · BLEVINS</text>
  <line x1="239" y1="177" x2="980" y2="177" stroke="#4f8bac" stroke-width="4"/>
  <line x1="239" y1="326" x2="980" y2="326" stroke="#bd8c5b" stroke-width="4"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g fill="#1c536f"><circle cx="260" cy="177" r="10"/><circle cx="510" cy="177" r="10"/><circle cx="760" cy="177" r="10"/><circle cx="975" cy="177" r="10"/></g>
    <g fill="#794c28"><circle cx="380" cy="326" r="10"/><circle cx="690" cy="326" r="10"/><circle cx="975" cy="326" r="10"/></g>
    <g fill="#17394f" font-size="17" font-weight="700"><text x="260" y="161">1829</text><text x="510" y="161">1850</text><text x="760" y="161">1884</text><text x="975" y="161">1946</text></g>
    <g fill="#744525" font-size="17" font-weight="700"><text x="380" y="311">1931</text><text x="690" y="311">1940</text><text x="975" y="311">1986</text></g>
    <g fill="#344d5b" font-size="15"><text x="260" y="213">Samuel + Jane</text><text x="510" y="213">Halifax household</text><text x="760" y="213">George + Ella</text><text x="975" y="213">Former Navy</text></g>
    <g fill="#654c3a" font-size="15"><text x="380" y="363">William + Mary</text><text x="690" y="363">Gladys, age 1</text><text x="975" y="363">Alice + John</text></g>
