<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="455" viewBox="0 0 1100 455" role="img" aria-labelledby="title desc">
  <title id="title">Ashley’s U.S. family timeline, with evidence limits</title>
  <desc id="desc">Two sequence lanes. The Weatherford lane shows Samuel and Jane marrying in 1829, the 1850 Halifax household, George and Ella marrying in 1884, and Garnett recorded as a former Navy serviceman by 1946. The Smith-Blevins lane shows William and Mary marrying in 1931, Gladys in the 1940 household, and Alice and John's 1986 marriage. Earlier origins are not established.</desc>
  <rect width="1100" height="455" rx="18" fill="#f7f6f2"/>
  <text x="40" y="51" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#193448">Ashley’s family: documented U.S. checkpoints</text>
  <text x="40" y="80" font-family="Arial,sans-serif" font-size="16" fill="#56636d">Two family paths · dates show sequence, not proportional time</text>
  <rect x="38" y="106" width="1024" height="137" rx="14" fill="#e4eff5"/>
  <rect x="38" y="256" width="1024" height="138" rx="14" fill="#f8ecde"/>
