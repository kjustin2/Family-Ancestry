  <g font-family="Arial, sans-serif" font-size="14" fill="#263e52">
    <circle cx="390" cy="220" r="9" fill="#fff" stroke="#bb7247" stroke-width="3"/><text x="337" y="253">Melissa: LCCC associate</text>
