<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="635" viewBox="0 0 1080 635" role="img" aria-labelledby="title desc">
  <title id="title">Recent generations: family paths and the records that document them</title>
  <desc id="desc">Four horizontal lanes show Paul and Melissa, John and Alice, Alex and Justin, and Ashley. In the first lane, family accounts place both parents at Luzerne County Community College in the mid-1980s and Paul later at RIT. Filled circles mark contemporary person-specific records; hollow circles mark family accounts. The years run from 1980 to 2021.</desc>
