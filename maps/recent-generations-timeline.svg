  <text x="43" y="84" font-family="Arial, sans-serif" font-size="15" fill="#516072">Four paths through study, work and family records</text>
  <rect x="40" y="107" width="1000" height="439" rx="20" fill="#fff"/>
  <g stroke="#dce3e8" stroke-width="2"><line x1="330" y1="148" x2="330" y2="515"/><line x1="505" y1="148" x2="505" y2="515"/><line x1="680" y1="148" x2="680" y2="515"/><line x1="855" y1="148" x2="855" y2="515"/></g>
