<title id="title">Justin's paternal lines · rope, coal and technical study</title><desc id="desc">Two immigrant branches meet at Fred Kramer and Patricia Cordaro; the older Baden match is still open. Three generation bands compare dated work, assets and education across two branches. Colors distinguish recorded, family-reported and proposed details.</desc>
<style>
text{font-family:Arial,sans-serif;fill:#19363e}.title{font-size:27px;font-weight:700}.sub{font-size:14px}.column{font-size:18px;font-weight:700}.band{font-size:14px;font-weight:700;fill:#4b6268}.person{font-size:17px;font-weight:700}.key{font-size:11px;font-weight:700;letter-spacing:.04em}.value{font-size:14px}.badge{font-size:10px;font-weight:700;letter-spacing:.03em}.foot{font-size:12px;fill:#50666b}.card{fill:#fff;stroke:#c7d6d1;stroke-width:1.5;rx:12}.bar{fill:#e7efea}.recorded{fill:#327c67}.family{fill:#5675a2}.proposed{fill:#ac743b}
</style>
<rect width="1120" height="670" fill="#f8faf7"/>
<text x="25" y="43" class="title" id="visible-title">Justin's paternal lines · rope, coal and technical study</text>
<text x="25" y="68" class="sub" >Two immigrant branches meet at Fred Kramer and Patricia Cordaro; the older Baden match is still open.</text>
