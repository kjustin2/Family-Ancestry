<rect class="card" x="579" y="151" width="516" height="132"/><rect class="recorded" x="579" y="151" width="6" height="132" rx="3"/><text x="596" y="176" class="person" >Antonio · Sutera to Pennsylvania</text><text x="597" y="200" class="key" >WORK</text><text x="669" y="200" class="value" >Farm worker (1899); later miner</text><text x="597" y="223" class="key" >ASSET</text><text x="669" y="223" class="value" >No land value or earnings yet found</text><text x="597" y="246" class="key" >SCHOOL</text><text x="669" y="246" class="value" >No named school yet found</text><rect x="596" y="257" width="155" height="18" rx="9" fill="#eff2ed"/><text x="606" y="270" class="badge" >RECORDS + OPEN ASSETS</text>
<text x="27" y="302" class="band" >1938–1962 · industrial households</text>
