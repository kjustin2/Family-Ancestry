<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310" role="img" aria-labelledby="title desc">
  <title id="title">The Bosch and Kramer households, 1900 to 1930</title>
  <desc id="desc">Four dated records trace Rose Bosch from her parents' rented 363 Park Avenue household in 1900, through her marriage to Ferdinand Kramer in 1909 and their shared Park Avenue household in 1910, to 146 Prospect Street in 1930. The diagram does not assert exact move dates or building continuity.</desc>
  <rect width="960" height="310" rx="22" fill="#f5f1e8"/>
  <text x="34" y="42" fill="#24394a" font-family="Arial, sans-serif" font-size="24" font-weight="700">Rose Bosch and Ferdinand Kramer: two recorded homes</text>
  <text x="34" y="68" fill="#50616c" font-family="Arial, sans-serif" font-size="14">Wilkes-Barre, Pennsylvania · household records, not an exact moving diary</text>
  <path d="M130 122 H830" fill="none" stroke="#b1a89b" stroke-width="4"/>
  <g font-family="Arial, sans-serif">
    <circle cx="130" cy="122" r="10" fill="#bd633d"/><circle cx="365" cy="122" r="10" fill="#bd633d"/><circle cx="600" cy="122" r="10" fill="#bd633d"/><circle cx="830" cy="122" r="10" fill="#bd633d"/>
    <text x="130" y="104" text-anchor="middle" font-size="17" font-weight="700" fill="#24394a">1900</text>
    <text x="365" y="104" text-anchor="middle" font-size="17" font-weight="700" fill="#24394a">1909</text>
    <text x="600" y="104" text-anchor="middle" font-size="17" font-weight="700" fill="#24394a">1910</text>
    <text x="830" y="104" text-anchor="middle" font-size="17" font-weight="700" fill="#24394a">1930</text>
    <rect x="28" y="143" width="205" height="111" rx="12" fill="#fffaf1" stroke="#d3c6b5"/>
    <text x="42" y="169" font-size="16" font-weight="700" fill="#24394a">363 Park Avenue</text>
    <text x="42" y="192" font-size="13" fill="#50616c">Emil + Hilda; five children</text>
    <text x="42" y="212" font-size="13" fill="#50616c">Rose makes paper boxes</text>
    <text x="42" y="232" font-size="13" fill="#50616c">Rented home</text>
    <rect x="264" y="143" width="202" height="111" rx="12" fill="#fffaf1" stroke="#d3c6b5"/>
    <text x="278" y="169" font-size="16" font-weight="700" fill="#24394a">Married 17 February</text>
    <text x="278" y="192" font-size="13" fill="#50616c">Ferdinand Kramer</text>
    <text x="278" y="212" font-size="13" fill="#50616c">+ Rose Bosch</text>
    <text x="278" y="232" font-size="13" fill="#50616c">County marriage docket</text>
    <rect x="499" y="143" width="203" height="111" rx="12" fill="#fffaf1" stroke="#d3c6b5"/>
    <text x="513" y="169" font-size="16" font-weight="700" fill="#24394a">363 Park Avenue</text>
    <text x="513" y="192" font-size="13" fill="#50616c">Couple with Bosch parents</text>
    <text x="513" y="212" font-size="13" fill="#50616c">Ferdinand: rope mill</text>
    <text x="513" y="232" font-size="13" fill="#50616c">Emil: axle works</text>
    <rect x="729" y="143" width="203" height="111" rx="12" fill="#fffaf1" stroke="#d3c6b5"/>
    <text x="743" y="169" font-size="16" font-weight="700" fill="#24394a">146 Prospect Street</text>
    <text x="743" y="192" font-size="13" fill="#50616c">Ferdinand, Rose, children</text>
    <text x="743" y="212" font-size="13" fill="#50616c">Owned; radio recorded</text>
    <text x="743" y="232" font-size="13" fill="#50616c">$2,300 reported value</text>
  </g>
  <text x="34" y="286" fill="#50616c" font-family="Arial, sans-serif" font-size="13">Sources: 1900 and 1910 original censuses, 1909 marriage docket, 1930 original census; see branch page for scans.</text>
</svg>
