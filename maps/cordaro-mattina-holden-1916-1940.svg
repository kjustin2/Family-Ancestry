<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="410" viewBox="0 0 1120 410" role="img" aria-labelledby="title desc">
  <title id="title">Fannie Cordaro Mattina's Holden Street household, 1916 to 1940</title>
  <desc id="desc">A 1916 marriage docket names Fannie's parents Anthony Cordaro and Petra Magro. In 1920 Fannie, Stephen and their daughter lived with Anthony and Pietra at 438 Holden Street. In 1940 Stephen, Fannie and eight children rented 419 Holden Street for fifteen dollars a month, while Cordaro relatives occupied 438 and 440.</desc>
  <rect width="1120" height="410" rx="18" fill="#f5f3ec"/>
  <rect width="10" height="410" fill="#287e77"/>
  <g font-family="Arial,sans-serif">
    <text x="36" y="47" font-size="28" font-weight="700" fill="#193e44">Fannie's family stayed on Holden Street</text>
    <text x="36" y="75" font-size="15" fill="#52676a">A marriage record joins the households; census numbers show where they lived.</text>
    <rect x="35" y="105" width="320" height="223" rx="13" fill="#fff" stroke="#bed3cd" stroke-width="2"/>
    <text x="55" y="135" font-size="15" font-weight="700" fill="#287e77">1916 · MARRIAGE</text>
    <text x="55" y="171" font-size="21" font-weight="700" fill="#193e44">Stephen + Fannie</text>
    <text x="55" y="199" font-size="15" fill="#455b61">Fannie's parents: Anthony</text>
    <text x="55" y="221" font-size="15" fill="#455b61">Cordaro + Petra Magro</text>
    <text x="55" y="255" font-size="15" fill="#455b61">Stephen: miner · Fannie: 16</text>
    <text x="55" y="305" font-size="13" fill="#8b6137">Luzerne docket 76574, 13 August</text>
    <path d="M355 215 H393" fill="none" stroke="#b17b41" stroke-width="4"/>
    <rect x="393" y="105" width="320" height="223" rx="13" fill="#fff" stroke="#bed3cd" stroke-width="2"/>
    <text x="413" y="135" font-size="15" font-weight="700" fill="#287e77">1920 · 438 HOLDEN</text>
    <text x="413" y="171" font-size="21" font-weight="700" fill="#193e44">Two generations together</text>
    <text x="413" y="199" font-size="15" fill="#455b61">Anthony + Pietra; Fannie,</text>
    <text x="413" y="221" font-size="15" fill="#455b61">Stephen + daughter Marion</text>
    <text x="413" y="255" font-size="15" fill="#455b61">Home marked owned, mortgage-free</text>
    <text x="413" y="305" font-size="13" fill="#8b6137">Census ED 215, sheet 9A</text>
    <path d="M713 215 H751" fill="none" stroke="#b17b41" stroke-width="4"/>
    <rect x="751" y="105" width="334" height="223" rx="13" fill="#e8f1eb" stroke="#91bcb0" stroke-width="2"/>
    <text x="771" y="135" font-size="15" font-weight="700" fill="#287e77">1940 · 419 HOLDEN</text>
    <text x="771" y="171" font-size="21" font-weight="700" fill="#193e44">Stephen + Fannie</text>
    <text x="771" y="199" font-size="15" fill="#455b61">Eight children listed at home</text>
    <text x="771" y="231" font-size="15" fill="#455b61">Rented · $15 per month</text>
    <text x="771" y="305" font-size="13" fill="#8b6137">Census ED 40-277, sheet 13B</text>
    <text x="36" y="365" font-size="15" fill="#455b61">At the same 1940 census, Cordaro relatives were recorded at 438 and 440 Holden.</text>
    <text x="36" y="388" font-size="13" fill="#725532">Addresses and housing reports are census evidence; a surviving building or deed still needs separate proof.</text>
  </g>
</svg>
