<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" role="img" aria-labelledby="title desc"><title id="title">1940 housing context for four family regions</title><desc id="desc">Left: Duffy Weatherford’s 1000 dollar home estimate versus Virginia’s 2633 dollar median, and Ferdinand Kramer’s 2400 dollar estimate versus Pennsylvania’s 3205 dollar median. Right: 1940 median gross monthly rents were 45 dollars in DC, 27 in Pennsylvania, 19 in Virginia, and 15 in Tennessee. Family estimates and state medians are broad comparisons, not measures of wealth.</desc><rect x="0" y="0" width="1200" height="770" rx="0" fill="#f7f5ee"/><rect x="0" y="0" width="13" height="770" rx="0" fill="#a27432"/><text x="45" y="58" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" fill="#17343d" text-anchor="start">A 1940 housing snapshot</text><text x="45" y="89" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#53686d" text-anchor="start">Two original household entries beside Census Bureau state figures</text><rect x="40" y="118" width="535" height="535" rx="16" fill="#ffffff"/><rect x="600" y="118" width="560" height="535" rx="16" fill="#ffffff"/><text x="64" y="160" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#17343d" text-anchor="start">Reported home value</text><text x="64" y="188" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#53686d" text-anchor="start">1940 dollars · family and state, side by side</text><text x="624" y="160" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#17343d" text-anchor="start">Median gross monthly rent</text><text x="624" y="188" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#53686d" text-anchor="start">1940 dollars · statewide housing markets</text><text x="64" y="230" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#17343d" text-anchor="start">Virginia</text><text x="64" y="269" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#17343d" text-anchor="start">Duffy Weatherford</text><rect x="222" y="249" width="300" height="22" rx="7" fill="#eef2f0"/><rect x="222" y="249" width="86" height="22" rx="7" fill="#a27432"/><text x="550" y="267" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#17343d" text-anchor="end">$1,000</text><text x="64" y="313" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#53686d" text-anchor="start">State median</text><rect x="222" y="293" width="300" height="22" rx="7" fill="#eef2f0"/><rect x="222" y="293" width="226" height="22" rx="7" fill="#527788"/><text x="550" y="311" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#17343d" text-anchor="end">$2,633</text><text x="64" y="424" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#17343d" text-anchor="start">Pennsylvania</text><text x="64" y="463" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#17343d" text-anchor="start">Ferdinand Kramer</text><rect x="222" y="443" width="300" height="22" rx="7" fill="#eef2f0"/><rect x="222" y="443" width="206" height="22" rx="7" fill="#a27432"/><text x="550" y="461" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#17343d" text-anchor="end">$2,400</text><text x="64" y="507" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#53686d" text-anchor="start">State median</text><rect x="222" y="487" width="300" height="22" rx="7" fill="#eef2f0"/><rect x="222" y="487" width="275" height="22" rx="7" fill="#527788"/><text x="550" y="505" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#17343d" text-anchor="end">$3,205</text><text x="624" y="241" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#17343d" text-anchor="start">DC</text><rect x="768" y="222" width="300" height="25" rx="7" fill="#eef2f0"/><rect x="768" y="222" width="270" height="25" rx="7" fill="#527788"/><text x="1093" y="241" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#17343d" text-anchor="start">$45</text><text x="624" y="327" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#17343d" text-anchor="start">Pennsylvania</text><rect x="768" y="308" width="300" height="25" rx="7" fill="#eef2f0"/><rect x="768" y="308" width="162" height="25" rx="7" fill="#527788"/><text x="1093" y="327" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#17343d" text-anchor="start">$27</text><text x="624" y="413" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#17343d" text-anchor="start">Virginia</text><rect x="768" y="394" width="300" height="25" rx="7" fill="#eef2f0"/><rect x="768" y="394" width="114" height="25" rx="7" fill="#527788"/><text x="1093" y="413" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#17343d" text-anchor="start">$19</text><text x="624" y="499" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#17343d" text-anchor="start">Tennessee</text><rect x="768" y="480" width="300" height="25" rx="7" fill="#eef2f0"/><rect x="768" y="480" width="90" height="25" rx="7" fill="#527788"/><text x="1093" y="499" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#17343d" text-anchor="start">$15</text><text x="64" y="626" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#6b7778" text-anchor="start">Family values: original 1940 census entries</text><text x="624" y="626" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#6b7778" text-anchor="start">Gross rent includes tenant-paid utilities and fuels</text><text x="45" y="690" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#17343d" text-anchor="start">State medians are broad context; house type, lot and neighborhood may differ.</text><text x="45" y="719" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#53686d" text-anchor="start">Values, rents and wages are different measures. None establishes equity, savings or inheritance.</text><text x="45" y="747" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#617579" text-anchor="start">Sources and definition notes: context/housing-and-work-1940.md</text></svg>