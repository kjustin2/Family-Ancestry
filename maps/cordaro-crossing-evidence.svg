<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="title desc">
  <title id="title">Antonio Cordaro's reported route from Sicily to Pennsylvania</title>
  <desc id="desc">His 1927 petition reports a journey from Palermo to New York in April 1906. A candidate passenger list disagrees on port and arrival day. By 1921, his declaration places him in West Wyoming, Pennsylvania, where he worked as a miner.</desc>
  <rect width="1280" height="340" rx="20" fill="#f7f3ec"/>
  <g font-family="Arial,sans-serif" fill="#26363d">
    <text x="35" y="43" font-size="25" font-weight="700">Antonio's journey, with the remaining uncertainty visible</text>
    <text x="35" y="70" font-size="15" fill="#526267">Solid = documented place or reported route on signed petition. Dashed = conflicting passenger-list candidate.</text>
    <rect x="35" y="110" width="250" height="115" rx="12" fill="#e1efe5" stroke="#4c8b67" stroke-width="2"/>
    <text x="55" y="145" font-size="20" font-weight="700">Milocca / Sutera</text>
    <text x="55" y="175" font-size="15">Antonio's birthplace</text>
    <text x="55" y="198" font-size="14">Petra's reported birth area</text>
    <rect x="335" y="110" width="255" height="115" rx="12" fill="#fff1d9" stroke="#ba853b" stroke-width="2"/>
    <text x="355" y="145" font-size="20" font-weight="700">Palermo → New York</text>
    <text x="355" y="175" font-size="15">Antonio's 1906 account</text>
    <text x="355" y="198" font-size="14">8 Apr departure · 20 Apr arrival</text>
    <rect x="640" y="110" width="270" height="115" rx="12" fill="#e3ebf6" stroke="#5b79a1" stroke-width="2"/>
    <text x="660" y="145" font-size="20" font-weight="700">West Wyoming, PA</text>
    <text x="660" y="175" font-size="15">Miner by 1921–27</text>
    <text x="660" y="198" font-size="14">Joseph born here, per petition</text>
    <rect x="960" y="110" width="280" height="115" rx="12" fill="#ecede9" stroke="#7c827b" stroke-width="2"/>
    <text x="980" y="145" font-size="20" font-weight="700">Scranton, PA</text>
    <text x="980" y="175" font-size="15">1927 citizenship petition</text>
    <text x="980" y="198" font-size="14">1928 naturalization index</text>
    <path d="M285 165 H330 M590 165 H635 M910 165 H955" fill="none" stroke="#50676b" stroke-width="3" marker-end="url(#arrow)"/>
    <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#50676b"/></marker></defs>
    <text x="315" y="268" font-size="14" fill="#8d5b32">Candidate Weimar list: Naples → New York, 23 Apr</text>
    <path d="M315 281 H662" fill="none" stroke="#b77a45" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="35" y="312" font-size="14" fill="#526267">The sea route is a recollection in Antonio's naturalization papers; Petra's voyage and the exact passenger match remain open.</text>
  </g>
</svg>
