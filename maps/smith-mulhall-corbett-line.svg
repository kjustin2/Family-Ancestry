<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="680" viewBox="0 0 1020 680" role="img" aria-labelledby="title desc">
  <title id="title">Mulhall and Corbett families in Washington, DC, toward Ashley's Smith line</title>
  <desc id="desc">The 1880 census names Irish-born John and Mary Mulhall as John Thomas Mulhall's parents. Nearby William Corbett is a probable father of Margaret Corbett, shown by a dashed line. John Thomas and Margaret are recorded parents of Alice, who married Raymond Smith and had son James. A dashed final link denotes the unproved match between that son and Ashley's grandfather.</desc>
  <rect width="1020" height="680" fill="#f5f2e9"/><rect width="9" height="680" fill="#58788b"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="34" y="43" font-size="26" font-weight="700" fill="#17394c">From Irish parents to a Washington family</text>
    <text x="34" y="70" font-size="15" fill="#4d6571">1880 names John's parents; a neighboring Corbett household offers a promising lead.</text>
    <g fill="#fff" stroke="#cbd8d7" stroke-width="1.5">
      <rect x="34" y="105" width="454" height="90" rx="11"/><rect x="532" y="105" width="454" height="90" rx="11"/>
      <rect x="34" y="238" width="454" height="91" rx="11"/><rect x="532" y="238" width="454" height="91" rx="11"/>
      <rect x="34" y="372" width="454" height="91" rx="11"/><rect x="532" y="372" width="454" height="91" rx="11"/>
      <rect x="273" y="510" width="474" height="82" rx="11"/>
    </g>
    <g fill="#17394c" font-size="19" font-weight="700">
      <text x="51" y="136">John + Mary Mulhall</text><text x="549" y="136">William Corbett · candidate</text>
      <text x="51" y="269">John Thomas Mulhall</text><text x="549" y="269">Margaret “Maggie” Corbett</text>
      <text x="51" y="403">Alice M. Mulhall Smith</text><text x="549" y="403">Raymond J. Smith</text>
      <text x="290" y="540">James A. Smith · DC son</text>
    </g>
    <g fill="#4d6571" font-size="15">
      <text x="51" y="162">Both born Ireland; gardener + homemaker in 1880</text><text x="549" y="162">Ireland-born laborer; Maggie worked in a store</text>
      <text x="51" y="295">1880 brass molder; later water foreman</text><text x="549" y="295">DC-born; likely Maggie next door in 1880</text>
      <text x="51" y="429">Born 1894; with parents and spouse in 1920</text><text x="549" y="429">Son-in-law in 1920; optician at optical shop</text>
      <text x="290" y="567">With Raymond and Alice in 1940 + 1950</text>
    </g>
    <path d="M261 195 V238 M261 329 V350 H261 V372 M759 329 V350 H261 M261 463 V486 H510 V510 M759 463 V486 H510" fill="none" stroke="#58788b" stroke-width="3"/>
    <path d="M759 195 V238" fill="none" stroke="#b17551" stroke-width="3" stroke-dasharray="7 5"/>
    <text x="792" y="219" font-size="13" fill="#704d3c">probable</text>
    <line x1="510" y1="592" x2="510" y2="611" stroke="#b17551" stroke-width="3" stroke-dasharray="7 5"/>
    <rect x="191" y="611" width="638" height="43" rx="9" fill="#fff1e8" stroke="#d9b59d"/>
    <text x="206" y="638" font-size="15" fill="#704d3c">1957 James + Gladys notice fits Ashley's grandparents; parent link open.</text>
  </g>
</svg>
