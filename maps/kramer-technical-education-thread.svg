  <rect x="46" y="474" width="1108" height="90" rx="14" fill="#e9eeec"/>
  <text x="64" y="501" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#245e69">What the line means</text>
  <text x="64" y="527" font-family="Arial,sans-serif" font-size="15" fill="#173940">Cards follow the study theme. Degrees are family-reported; some dates are approximate. Direct influence is not established.</text>
  <text x="46" y="597" font-family="Arial,sans-serif" font-size="14" fill="#52676d">Sources and caveats: Ferdinand Louis's obituary; Justin's family account, 27 September 2026 · see the education guide.</text>
