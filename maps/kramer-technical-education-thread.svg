<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">A Kramer thread from radio study to engineering and computer science</title>
  <desc id="desc">Four family study paths: Ferdinand Louis at the National Radio Institute; his grandson Paul, who attended RIT around 1986 and completed electrical engineering at an unspecified date; Paul's son Alex, with electrical engineering degrees from Penn State starting 2014 and Georgia Tech around 2020; and Alex's brother Justin, with a computer science bachelor's and master's at Pitt from 2017 to 2021. Fred is the intervening generation. Later university degrees come from Justin's family account; the graphic does not claim direct influence.</desc>
  <rect width="1200" height="620" rx="24" fill="#f6f3eb"/>
  <rect x="0" y="0" width="14" height="620" fill="#267685"/>
  <text x="46" y="56" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#173940">From radio lessons to computing</text>
  <text x="46" y="85" font-family="Arial,sans-serif" font-size="16" fill="#52676d">A recurring technical interest in the Kramer family · study paths, not a proven chain of influence</text>

  <rect x="46" y="118" width="1108" height="60" rx="12" fill="#e5edeb"/>
  <text x="66" y="144" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#245e69">FAMILY BRIDGE</text>
  <text x="66" y="166" font-family="Arial,sans-serif" font-size="16" fill="#173940">Ferdinand Louis (1913) → son Fred / Ferdinand Francis (1939) → grandson Paul → sons Alex and Justin</text>

