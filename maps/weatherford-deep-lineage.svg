<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="790" viewBox="0 0 1080 790" role="img" aria-labelledby="title desc"><title id="title">Five generations of Ashley Weatherford’s paternal family</title><desc id="desc">George C. Weatherford and Ella Lumpkin, and John R. Neathery and Annie Phelps, precede Doctor Duffy Weatherford and Annie Lillian Neathery, Garnett and Florence Weatherford, John and Alice Weatherford, and Ashley with siblings John Jr. and Tancy. Original certificates and censuses support the older generations; the most recent links are family supplied.</desc><rect width="1080" height="790" fill="#f6f3eb"/><rect x="0" y="0" width="12" height="790" fill="#127f82"/><text x="54" y="62" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" fill="#163348" >Ashley’s Weatherford line, five generations</text><text x="54" y="91" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#52616a" >Death certificates and censuses connect the older relatives; living links use family accounts.</text><rect x="54" y="122" width="464" height="88" rx="13" fill="#fff" stroke="#d8dedc"/><rect x="54" y="122" width="8" height="88" rx="4" fill="#127f82"/><text x="76" y="146" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#127f82" >DUFFY’S PARENTS</text><text x="76" y="173" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#163348" >George C. + Ella Lumpkin</text><text x="76" y="195" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#52616a" >Duffy’s 1966 certificate names both</text><rect x="562" y="122" width="464" height="88" rx="13" fill="#fff" stroke="#d8dedc"/><rect x="562" y="122" width="8" height="88" rx="4" fill="#b46827"/><text x="584" y="146" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#b46827" >ANNIE’S PARENTS</text><text x="584" y="173" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#163348" >John R. Neathery + Annie Phelps</text><text x="584" y="195" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#52616a" >Annie’s 1969 certificate names both</text><rect x="192" y="257" width="696" height="88" rx="13" fill="#fff" stroke="#d8dedc"/><rect x="192" y="257" width="8" height="88" rx="4" fill="#127f82"/><text x="214" y="281" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#127f82" >GREAT-GRANDPARENTS</text><text x="214" y="308" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#163348" >Doctor Duffy + Annie Lillian</text><text x="214" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#52616a" >Duffy: Caswell County, NC → Dan River, VA</text><rect x="192" y="392" width="696" height="88" rx="13" fill="#fff" stroke="#d8dedc"/><rect x="192" y="392" width="8" height="88" rx="4" fill="#127f82"/><text x="214" y="416" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#127f82" >GRANDPARENTS</text><text x="214" y="443" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#163348" >Garnett Sr. + Florence Morrison</text><text x="214" y="465" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#52616a" >Garnett: 1930 household; 1946 Navy-discharge card</text><rect x="192" y="527" width="696" height="88" rx="13" fill="#fff" stroke="#d8dedc"/><rect x="192" y="527" width="8" height="88" rx="4" fill="#5c6ba0"/><text x="214" y="551" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#5c6ba0" >PARENTS</text><text x="214" y="578" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#163348" >John Gordon + Alice Smith</text><text x="214" y="600" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#52616a" >1986 marriage return; Fairfax County homes</text><rect x="192" y="662" width="696" height="88" rx="13" fill="#fff" stroke="#d8dedc"/><rect x="192" y="662" width="8" height="88" rx="4" fill="#5c6ba0"/><text x="214" y="686" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#5c6ba0" >ASHLEY’S GENERATION</text><text x="214" y="713" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#163348" >Ashley · John Jr. · Tancy</text><text x="214" y="735" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#52616a" >Sibling group supplied by Justin</text><path d="M286 210 L286 233 L540 233 L540 257 M794 210 L794 233 L540 233" fill="none" stroke="#85979b" stroke-width="3"/><line x1="540" y1="345" x2="540" y2="392" stroke="#85979b" stroke-width="3"/><line x1="540" y1="480" x2="540" y2="527" stroke="#85979b" stroke-width="3"/><line x1="540" y1="615" x2="540" y2="662" stroke="#85979b" stroke-width="3"/><text x="54" y="773" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#52616a" >Earlier: George and Ella’s 1884 register names parents; the 1880 census has a name conflict.</text></svg>