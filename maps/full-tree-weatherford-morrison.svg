<title id="title">Ashley&#x27;s paternal lines: Weatherford + Morrison</title>
<desc id="desc">Two paths toward John Weatherford; uncertain nineteenth-century identity links stay dashed. The Asa/Thomas name conflict and Roscoe&#x27;s exact Celia birth link need original records. The older Samuel line is a strong candidate, not a closed pedigree.</desc>
