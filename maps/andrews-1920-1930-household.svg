<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="380" viewBox="0 0 1080 380" role="img" aria-labelledby="title desc">
  <title id="title">The Andrews household from 1920 to 1930</title>
  <desc id="desc">The 1920 census shows Frank, Mary and five children across two pages. Mary's original 1929 death certificate names parents Edward Kennedy and Mary Durkin at 21 Flick Street; an original newspaper notice names six children. In 1930 Frank is widowed with the children at 71 Flick Street.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#277b77"/></marker></defs>
  <rect width="1080" height="380" fill="#f5f2eb"/>
  <text x="38" y="49" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#17364a">A mother, six children, and a changed household</text>
  <text x="38" y="76" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#526974">Select each card to inspect its evidence</text>
  <a href="../sources/records/frank-andrews-family-census-1920-sheet-3b.jpg"><rect x="38" y="108" width="308" height="213" rx="14" fill="#fff" stroke="#bccfcc" stroke-width="2"/><rect x="38" y="108" width="308" height="47" rx="14" fill="#277b77"/><text x="58" y="139" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">1920 · Plains Township</text><text x="58" y="184" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#17364a">Frank + Mary</text><text x="58" y="213" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#17364a">Anna · Edward · Francis</text><text x="58" y="238" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#17364a">Michael · younger Mary</text><text x="58" y="286" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#526974">Frank is on the preceding census page.</text></a>
  <line x1="353" y1="218" x2="383" y2="218" stroke="#277b77" stroke-width="3" marker-end="url(#arrow)"/>
  <a href="https://www.findagrave.com/memorial/126529268/mary-andrews/photo#view-photo=218591682"><rect x="395" y="108" width="286" height="213" rx="14" fill="#fff" stroke="#d9bcab" stroke-width="2"/><rect x="395" y="108" width="286" height="47" rx="14" fill="#b26d50"/><text x="415" y="139" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">1929 · 21 Flick Street</text><text x="415" y="184" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#17364a">25 May · death certificate</text><text x="415" y="216" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#17364a">Edward Kennedy + Mary Durkin</text><text x="415" y="244" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#17364a">named as Mary's parents</text><text x="415" y="286" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#526974">Original notice names six children.</text></a>
  <line x1="688" y1="218" x2="718" y2="218" stroke="#277b77" stroke-width="3" marker-end="url(#arrow)"/>
  <a href="../sources/records/frank-andrews-children-census-1930.jpg"><rect x="730" y="108" width="312" height="213" rx="14" fill="#fff" stroke="#bccfcc" stroke-width="2"/><rect x="730" y="108" width="312" height="47" rx="14" fill="#277b77"/><text x="750" y="139" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">1930 · 71 Flick Street</text><text x="750" y="184" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#17364a">Frank · widowed</text><text x="750" y="213" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#17364a">The same five children</text><text x="750" y="238" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#17364a">plus youngest daughter Rita</text><text x="750" y="286" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#526974">Owned home: reported value $5,000.</text></a>
  <text x="38" y="354" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#526974">Sources: original census pages, photographed Pennsylvania certificate and 1929 clipping. The 21 → 71 address change is unexplained.</text>
</svg>
