<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="410" viewBox="0 0 1060 410" role="img" aria-labelledby="title desc">
  <title id="title">Dina Caucci's documented family and separate census leads</title>
  <desc id="desc">The 1938 marriage application names Joseph Caucci and Anna Belardinelli as Dina's parents. A 1962 application names Dina and Joseph Cordaro as Patricia's parents. The Winton census Joseph and an Anna Caucci cemetery entry remain identity leads.</desc>
  <rect width="1060" height="410" rx="18" fill="#f7f4ee"/>
  <g font-family="Arial,sans-serif" fill="#25363b">
    <text x="28" y="40" font-size="25" font-weight="700">Dina's Caucci branch: records and leads</text>
    <text x="28" y="65" font-size="14" fill="#526267">Solid connectors = parent named on an original application · dashed = identity still to test</text>
    <rect x="28" y="91" width="420" height="74" rx="10" fill="#dceee9" stroke="#31847a" stroke-width="2"/>
    <text x="44" y="117" font-size="13" font-weight="700" fill="#22675f">DINA'S PARENTS · 1938 APPLICATION</text>
    <text x="44" y="144" font-size="18" font-weight="700">Joseph Caucci + Anna Belardinelli</text>
    <path d="M238 165 V194" stroke="#31847a" stroke-width="3"/>
    <rect x="28" y="194" width="420" height="74" rx="10" fill="#e8eeff" stroke="#637cb5" stroke-width="2"/>
    <text x="44" y="220" font-size="13" font-weight="700" fill="#526aa5">1938 JESSUP MARRIAGE</text>
    <text x="44" y="247" font-size="19" font-weight="700">Dena / Dina + Joseph Cordaro</text>
    <path d="M238 268 V296" stroke="#31847a" stroke-width="3"/>
    <rect x="28" y="296" width="420" height="70" rx="10" fill="#f8e9d5" stroke="#b77a2d" stroke-width="2"/>
    <text x="44" y="322" font-size="13" font-weight="700" fill="#9c632a">1962 APPLICATION NAMES PARENTS</text>
    <text x="44" y="348" font-size="19" font-weight="700">Patricia Cordaro Kramer</text>
    <path d="M448 116 H530" stroke="#9f8b70" stroke-width="2" stroke-dasharray="7 5"/>
    <rect x="530" y="91" width="500" height="104" rx="10" fill="#fff" stroke="#9f8b70" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="548" y="118" font-size="13" font-weight="700" fill="#81694f">WINTON / JESSUP HOUSEHOLD LEAD</text>
    <text x="548" y="146" font-size="17" font-weight="700">Joseph Caucci · 1930, 1940, 1950</text>
    <text x="548" y="175" font-size="14">Lina, 12: possible Dina · Lando repeats across decades</text>
    <path d="M448 148 H480 V253 H530" stroke="#9f8b70" stroke-width="2" stroke-dasharray="7 5" fill="none"/>
    <rect x="530" y="219" width="500" height="83" rx="10" fill="#fff" stroke="#9f8b70" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="548" y="246" font-size="13" font-weight="700" fill="#81694f">SEPARATE BURIAL LEAD · PERSON NOT PROVED</text>
    <text x="548" y="274" font-size="17" font-weight="700">Anna Caucci · 1925 · Prospect Hill</text>
    <text x="530" y="340" font-size="14" fill="#526267">Joseph candidate: Sassoferrato birthplace on 1942 card.</text>
    <text x="530" y="358" font-size="14" fill="#526267">Anna: 1913 same-name manifest lead; marriage still unproved.</text>
    <text x="530" y="382" font-size="14" fill="#526267">Sources and caveats: branches/caucci-belardinelli.md</text>
  </g>
</svg>
