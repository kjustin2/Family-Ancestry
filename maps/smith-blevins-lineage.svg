<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660" role="img" aria-labelledby="title desc"><title id="title">Evidence map of Alice Smith Weatherford’s ancestry</title><desc id="desc">Alice and four named siblings are children of James Allen Smith and Gladys Louise Blevins; original marriage returns name the parents for four of the five children. A 1957 license notice joins James and Gladys in Washington, DC. Raymond J. Smith and Alice M. Mulhall are probable parents of James; the notice does not name them. The older Blevins connection remains a lead.</desc><rect width="1080" height="660" fill="#f6f3eb"/><rect x="0" y="0" width="12" height="660" fill="#b46827"/><text x="54" y="62" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" fill="#163348" >Alice’s Smith and Blevins evidence map</text><text x="54" y="91" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#52616a" >Solid: census, marriage or memorial link  ·  Dashed: candidate or member-tree lead</text><rect x="54" y="122" width="463" height="93" rx="13" fill="#fff" stroke="#d8dedc"/><rect x="54" y="122" width="8" height="93" rx="4" fill="#547487"/><text x="76" y="149" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#163348" >Raymond J. + Alice M. Mulhall</text><text x="76" y="175" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#163348" >Probable parents of James</text><text x="76" y="199" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#52616a" >1917 marriage, 1940–50 census; 1957 lead</text><rect x="562" y="122" width="463" height="93" rx="13" fill="#fff" stroke="#d8dedc"/><rect x="562" y="122" width="8" height="93" rx="4" fill="#b46827"/><text x="584" y="149" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#163348" >W. Howard Blevins + Mary E. Hines</text><text x="584" y="175" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#163348" >Gladys’s parents · married 1931</text><text x="584" y="199" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#52616a" >1940 household has G. Louise Blevins</text><rect x="54" y="275" width="463" height="93" rx="13" fill="#fff" stroke="#d8dedc"/><rect x="54" y="275" width="8" height="93" rx="4" fill="#547487"/><text x="76" y="302" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#163348" >James Allen Smith</text><text x="76" y="328" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#163348" >1933–1990 on shared grave marker</text><text x="76" y="352" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#52616a" >1986 return names him as Alice’s father</text><rect x="562" y="275" width="463" height="93" rx="13" fill="#fff" stroke="#d8dedc"/><rect x="562" y="275" width="8" height="93" rx="4" fill="#b46827"/><text x="584" y="302" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#163348" >Gladys Louise Blevins Smith</text><text x="584" y="328" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#163348" >1938–2008 · born Bristol, Virginia</text><text x="584" y="352" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#52616a" >2008 memorial names husband and five children</text><rect x="185" y="451" width="710" height="93" rx="13" fill="#fff" stroke="#d8dedc"/><rect x="185" y="451" width="8" height="93" rx="4" fill="#5c6ba0"/><text x="207" y="478" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#163348" >Five children, including Alice</text><text x="207" y="504" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#163348" >Jane · James “Buck” · Timothy · Alice · Carolyn</text><text x="207" y="528" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#52616a" >2008 memorial; four children have original returns</text><line x1="285" y1="215" x2="285" y2="275" stroke="#547487" stroke-width="3" stroke-dasharray="7 7"/><line x1="794" y1="215" x2="794" y2="275" stroke="#b46827" stroke-width="3"/><path d="M285 368 L285 412 L540 412 L540 451 M794 368 L794 412 L540 412" fill="none" stroke="#85979b" stroke-width="3"/><text x="54" y="593" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#344954" >Further Blevins: William E.’s certificate names Shubiel + Ada; his 1918 marriage names Tancy.</text><text x="54" y="624" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#52616a" >William Howard → William E. remains a 1920-household lead; see deeper evidence ladder.</text></svg>