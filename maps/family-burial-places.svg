<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
  <title id="title">Family burial places in the eastern United States</title>
  <desc id="desc">Approximate cemetery locations for Pennsylvania, the Washington area, and southwest Virginia. Circles mark cemetery areas, not graves. Solid circles have contemporary or original burial evidence; outlined circles rely on contributor or transcription records.</desc>
  <rect width="1000" height="600" fill="#f7f5ee"/>
  <text x="42" y="52" fill="#18344b" font-family="Arial,sans-serif" font-size="31" font-weight="700">Where the records lead</text>
  <text x="42" y="78" fill="#566d79" font-family="Arial,sans-serif" font-size="15">Eastern U.S. locator • approximate cemetery sites, never grave coordinates</text>
  <rect x="42" y="105" width="570" height="440" rx="19" fill="#e8f0ed" stroke="#cedbd7"/>
  <path d="M75 199H576M75 279H576M75 359H576M75 439H576M155 129V521M265 129V521M375 129V521M485 129V521" stroke="#cbd9d4" stroke-width="1" stroke-dasharray="4 8"/>
  <text x="84" y="152" fill="#9aaea9" font-family="Arial,sans-serif" font-size="15" letter-spacing="3">WEST</text>
  <text x="486" y="152" fill="#9aaea9" font-family="Arial,sans-serif" font-size="15" letter-spacing="3">EAST</text>
  <text x="88" y="218" fill="#9aad9f" font-family="Arial,sans-serif" font-size="25" font-weight="700">PENNSYLVANIA</text>
  <text x="88" y="390" fill="#9aad9f" font-family="Arial,sans-serif" font-size="25" font-weight="700">VIRGINIA</text>
  <text x="394" y="368" fill="#9aad9f" font-family="Arial,sans-serif" font-size="17" font-weight="700">DC / MD</text>
  <g font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    <circle cx="234" cy="237" r="16" fill="white" stroke="#1d6985" stroke-width="3"/><text x="234" y="242" fill="#1d6985">1</text>
    <circle cx="521" cy="198" r="16" fill="white" stroke="#1d6985" stroke-width="3"/><text x="521" y="203" fill="#1d6985">2</text>
    <circle cx="498" cy="229" r="16" fill="#1d6985"/><text x="498" y="234" fill="white">3</text>
    <circle cx="554" cy="176" r="16" fill="white" stroke="#1d6985" stroke-width="3"/><text x="554" y="181" fill="#1d6985">8</text>
    <circle cx="493" cy="334" r="16" fill="#b85c42"/><text x="493" y="339" fill="white">4</text>
    <circle cx="467" cy="371" r="16" fill="#b85c42"/><text x="467" y="376" fill="white">5</text>
    <circle cx="535" cy="348" r="16" fill="#b85c42"/><text x="535" y="353" fill="white">6</text>
    <circle cx="97" cy="494" r="16" fill="#8c6c4d"/><text x="97" y="499" fill="white">7</text>
  </g>
  <text x="69" y="566" fill="#596e73" font-family="Arial,sans-serif" font-size="13">Positions are regional approximations; check the linked cemetery maps for directions.</text>
  <g font-family="Arial,sans-serif" fill="#223d50">
    <text x="649" y="127" font-size="19" font-weight="700">Pennsylvania</text>
    <text x="649" y="155" font-size="15"><tspan font-weight="700">1</tspan> Oakmont-Verona · Louisa Hollinger</text>
    <text x="649" y="181" font-size="15"><tspan font-weight="700">2</tspan> Hanover Green · Matthew lead</text>
    <text x="649" y="207" font-size="15"><tspan font-weight="700">3</tspan> Rose Lawn · Pearl, Carl, Wilbur lead</text>
    <text x="649" y="233" font-size="15"><tspan font-weight="700">8</tspan> St. Cecilia's · Antonio/Pietra lead</text>
    <text x="649" y="256" font-size="19" font-weight="700">Capital region</text>
    <text x="649" y="284" font-size="15"><tspan font-weight="700">4</tspan> Falls Church · Weatherford family</text>
    <text x="649" y="310" font-size="15"><tspan font-weight="700">5</tspan> Fairfax · James &amp; Gladys Smith</text>
    <text x="649" y="336" font-size="15"><tspan font-weight="700">6</tspan> Suitland · Mary Hines Blevins</text>
    <text x="649" y="385" font-size="19" font-weight="700">Southwest Virginia</text>
    <text x="649" y="413" font-size="15"><tspan font-weight="700">7</tspan> Marion area · Shubiel, William E.</text>
    <text x="649" y="439" font-size="14">Two separate cemeteries: Laurel Springs</text>
    <text x="649" y="460" font-size="14">and Thomas. An ancestry link is still open.</text>
  </g>
  <circle cx="661" cy="506" r="8" fill="#b85c42"/><text x="680" y="511" fill="#566d79" font-family="Arial,sans-serif" font-size="13">Solid: notice, program, original, or marker</text>
  <circle cx="661" cy="532" r="8" fill="white" stroke="#1d6985" stroke-width="2"/><text x="680" y="537" fill="#566d79" font-family="Arial,sans-serif" font-size="13">Outline: contributor / transcription lead</text>
</svg>
