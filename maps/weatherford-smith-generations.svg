<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660" role="img" aria-labelledby="title desc"><title id="title">Weatherford and Smith family generations</title><desc id="desc">Four layers from D.D. and Annie Weatherford and the documented parents of Gladys Blevins to Garnett and Florence, James and Gladys, John and Alice, then Ashley, John Jr. and Tancy. James Smith’s parents remain unconfirmed.</desc><rect width="1080" height="660" fill="#f6f3eb"/><rect x="0" y="0" width="12" height="660" fill="#127f82"/><text x="54" y="62" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" fill="#163348" >Four layers of the Weatherford–Smith family</text><text x="54" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#52616a" >Census and marriage records now identify Gladys’s parents; James’s earlier link remains open.</text><rect x="54" y="125" width="464" height="88" rx="13" fill="#fff" stroke="#d8dedc"/><rect x="54" y="125" width="8" height="88" rx="4" fill="#127f82"/><text x="77" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#127f82" >GREAT-GRANDPARENTS</text><text x="77" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#163348" >Doctor Duffy + Annie Neathery</text><text x="77" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#52616a" >1930 household and original death records</text><rect x="562" y="125" width="464" height="88" rx="13" fill="#fff" stroke="#d8dedc"/><rect x="562" y="125" width="8" height="88" rx="4" fill="#b46827"/><text x="585" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#b46827" >GLADYS’S PARENTS</text><text x="585" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#163348" >W. Howard Blevins + Mary Hines</text><text x="585" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#52616a" >1931 marriage · 1940 census household</text><rect x="54" y="255" width="464" height="88" rx="13" fill="#fff" stroke="#d8dedc"/><rect x="54" y="255" width="8" height="88" rx="4" fill="#127f82"/><text x="77" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#127f82" >GRANDPARENTS</text><text x="77" y="306" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#163348" >Garnett Sr. + Florence</text><text x="77" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#52616a" >Garnett Sr. is D.D. and Annie’s son</text><rect x="562" y="255" width="464" height="88" rx="13" fill="#fff" stroke="#d8dedc"/><rect x="562" y="255" width="8" height="88" rx="4" fill="#b46827"/><text x="585" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#b46827" >GRANDPARENTS</text><text x="585" y="306" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#163348" >James A. Smith + Gladys Blevins</text><text x="585" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#52616a" >2008 memorial names all five children</text><rect x="218" y="385" width="644" height="88" rx="13" fill="#fff" stroke="#d8dedc"/><rect x="218" y="385" width="8" height="88" rx="4" fill="#5c6ba0"/><text x="241" y="410" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#5c6ba0" >PARENTS</text><text x="241" y="436" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#163348" >John Gordon Weatherford Sr. + Alice Smith</text><text x="241" y="460" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#52616a" >John: three named siblings · Alice: four memorial-named siblings</text><rect x="218" y="515" width="644" height="88" rx="13" fill="#fff" stroke="#d8dedc"/><rect x="218" y="515" width="8" height="88" rx="4" fill="#5c6ba0"/><text x="241" y="540" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#5c6ba0" >CHILDREN</text><text x="241" y="566" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#163348" >Ashley · John Jr. · Tancy Weatherford</text><text x="241" y="590" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#52616a" >Family-supplied sibling group; dates not established</text><line x1="285" y1="213" x2="285" y2="255" stroke="#85979b" stroke-width="3"/><line x1="905" y1="213" x2="905" y2="255" stroke="#85979b" stroke-width="3"/><path d="M286 343 L286 367 L540 367 L540 385 M794 343 L794 367 L540 367" fill="none" stroke="#85979b" stroke-width="3"/><line x1="540" y1="473" x2="540" y2="515" stroke="#85979b" stroke-width="3"/><text x="54" y="634" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#52616a" >Gladys’s parent link is recorded; James’s parents and Florence’s parents remain unproved.</text></svg>