<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">Patricia Cordaro's documented ancestors and the separate passport lead</title>
  <desc id="desc">Italian-born Anthony Cordaro and Pietra Magro are named as Joseph's parents in a 1938 marriage application. Joseph Cordaro and Dena Caucci are named as Patricia's parents in a 1962 application. Fred Kramer is Patricia's husband. An Onofrio Cordaro passport from Sutera has no proven link to these people.</desc>
  <rect width="1200" height="350" rx="20" fill="#f7f3ec"/>
  <g font-family="Arial,sans-serif" fill="#25363b">
    <text x="30" y="44" font-size="25" font-weight="700">Patricia Cordaro: three generations now linked</text>
    <text x="30" y="70" font-size="15" fill="#526267">Solid arrows = relationships named in original marriage applications. The passport remains a separate lead.</text>
    <rect x="30" y="100" width="260" height="125" rx="13" fill="#dceee9" stroke="#31847a" stroke-width="2"/>
    <text x="48" y="126" font-size="14" font-weight="700" fill="#22675f">ITALY → PENNSYLVANIA</text>
    <text x="48" y="157" font-size="18" font-weight="700">Anthony Cordaro</text>
    <text x="48" y="181" font-size="18" font-weight="700">+ Pietra Magro</text>
    <text x="48" y="207" font-size="13" fill="#465f5b">Italy-born · West Wyoming by 1920</text>
    <rect x="338" y="100" width="265" height="125" rx="13" fill="#e7eeff" stroke="#6b7db2" stroke-width="2"/>
    <text x="356" y="126" font-size="14" font-weight="700" fill="#53669c">1938 MARRIAGE RECORD</text>
    <text x="356" y="157" font-size="18" font-weight="700">Joseph Cordaro</text>
    <text x="356" y="181" font-size="18" font-weight="700">+ Dena Caucci</text>
    <text x="356" y="207" font-size="13" fill="#535e7a">Dena's parents: Joseph + Anna</text>
    <rect x="651" y="100" width="230" height="125" rx="13" fill="#fae8ce" stroke="#b77a2d" stroke-width="2"/>
    <text x="669" y="126" font-size="14" font-weight="700" fill="#a0601b">1962 MARRIAGE RECORD</text>
    <text x="669" y="157" font-size="18" font-weight="700">Patricia Cordaro</text>
    <text x="669" y="181" font-size="18" font-weight="700">+ Fred Kramer</text>
    <text x="669" y="207" font-size="13" fill="#66553e">Patricia born Kingston, 1940</text>
    <rect x="929" y="100" width="241" height="125" rx="13" fill="#fff" stroke="#ab9d89" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="947" y="126" font-size="14" font-weight="700" fill="#9b642d">UNPLACED PASSPORT</text>
    <text x="947" y="157" font-size="18" font-weight="700">Onofrio? Cordaro</text>
    <text x="947" y="181" font-size="14">Sutera · c. 1878?</text>
    <text x="947" y="207" font-size="13" fill="#675e55">Kinship and voyage unknown</text>
    <path d="M290 162 H338 M603 162 H651" fill="none" stroke="#31847a" stroke-width="4"/>
    <path d="M320 155 L338 162 L320 169 M633 155 L651 162 L633 169" fill="none" stroke="#31847a" stroke-width="4"/>
    <text x="30" y="268" font-size="16" font-weight="700">What changed</text>
    <text x="30" y="294" font-size="15">County marriage applications identify Patricia’s parents and Joseph’s parents; the 1920 census shows the Italy-born couple in Pennsylvania.</text>
    <text x="30" y="320" font-size="14" fill="#526267">Sources and spelling variants: see the Cordaro page. Census arrival years still need passenger records.</text>
  </g>
</svg>
