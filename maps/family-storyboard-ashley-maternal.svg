<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 670" role="img" aria-labelledby="title desc">
<title id="title">Ashley's maternal lines · trades, homes and the Navy Yard</title><desc id="desc">Smith / Mulhall and Blevins / Hines paths have promising early records but two crucial parent links remain open. Three generation bands compare dated work, assets and education across two branches. Colors distinguish recorded, family-reported and proposed details.</desc>
<style>
text{font-family:Arial,sans-serif;fill:#19363e}.title{font-size:27px;font-weight:700}.sub{font-size:14px}.column{font-size:18px;font-weight:700}.band{font-size:14px;font-weight:700;fill:#4b6268}.person{font-size:17px;font-weight:700}.key{font-size:11px;font-weight:700;letter-spacing:.04em}.value{font-size:14px}.badge{font-size:10px;font-weight:700;letter-spacing:.03em}.foot{font-size:12px;fill:#50666b}.card{fill:#fff;stroke:#c7d6d1;stroke-width:1.5;rx:12}.bar{fill:#e7efea}.recorded{fill:#327c67}.family{fill:#5675a2}.proposed{fill:#ac743b}
</style>
<rect width="1120" height="670" fill="#f8faf7"/>
<text x="25" y="43" class="title" id="visible-title">Ashley's maternal lines · trades, homes and the Navy Yard</text>
<text x="25" y="68" class="sub" >Smith / Mulhall and Blevins / Hines paths have promising early records but two crucial parent links remain open.</text>
<rect class="bar" x="25" y="88" width="1070" height="38" rx="9"/>
<text x="42" y="113" class="column" >Smith · Mulhall · Corbett</text>
<text x="585" y="113" class="column" >Blevins · Hines · Cowan</text>
<text x="27" y="139" class="band" >1680s–1920 · older leads</text>
<rect class="card" x="25" y="151" width="516" height="132"/><rect class="proposed" x="25" y="151" width="6" height="132" rx="3"/><text x="42" y="176" class="person" >John Mulhall → DC Smith candidate</text><text x="43" y="200" class="key" >WORK</text><text x="115" y="200" class="value" >Gardener → brass molder → water foreman</text><text x="43" y="223" class="key" >ASSET</text><text x="115" y="223" class="value" >Rented in 1900; no earnings stated</text><text x="43" y="246" class="key" >SCHOOL</text><text x="115" y="246" class="value" >Named schools not found</text><rect x="42" y="257" width="161" height="18" rx="9" fill="#eff2ed"/><text x="52" y="270" class="badge" >ASHLEY LINK STILL OPEN</text>
<rect class="card" x="579" y="151" width="516" height="132"/><rect class="proposed" x="579" y="151" width="6" height="132" rx="3"/><text x="596" y="176" class="person" >James Blevin · Northeast lead</text><text x="597" y="200" class="key" >WORK</text><text x="669" y="200" class="value" >Oyster Bay sailor (1686/7)</text><text x="597" y="223" class="key" >ASSET</text><text x="669" y="223" class="value" >£20 tax rate (1683); £14 land sale</text><text x="597" y="246" class="key" >SCHOOL</text><text x="669" y="246" class="value" >No childhood school evidence</text><rect x="596" y="257" width="149" height="18" rx="9" fill="#eff2ed"/><text x="606" y="270" class="badge" >NOT LINKED TO ASHLEY</text>
<text x="27" y="302" class="band" >1920–1940 · skilled work and housing</text>
<rect class="card" x="25" y="314" width="516" height="132"/><rect class="proposed" x="25" y="314" width="6" height="132" rx="3"/><text x="42" y="339" class="person" >Raymond Smith · DC candidate</text><text x="43" y="363" class="key" >WORK</text><text x="115" y="363" class="value" >Optician, 1930 and 1950</text><text x="43" y="386" class="key" >ASSET</text><text x="115" y="386" class="value" >$35.50 monthly rent (1930)</text><text x="43" y="409" class="key" >SCHOOL</text><text x="115" y="409" class="value" >No named school found</text><rect x="42" y="420" width="161" height="18" rx="9" fill="#eff2ed"/><text x="52" y="433" class="badge" >JAMES PARENT LINK OPEN</text>
<rect class="card" x="579" y="314" width="516" height="132"/><rect class="recorded" x="579" y="314" width="6" height="132" rx="3"/><text x="596" y="339" class="person" >Hines + William Howard Blevins</text><text x="597" y="363" class="key" >WORK</text><text x="669" y="363" class="value" >Rail-yard machinist; varnish sprayer</text><text x="597" y="386" class="key" >ASSET</text><text x="669" y="386" class="value" >Hines home $4,000 (1930); Howard rent $12</text><text x="597" y="409" class="key" >SCHOOL</text><text x="669" y="409" class="value" >No named school for Howard</text><rect x="596" y="420" width="199" height="18" rx="9" fill="#eff2ed"/><text x="606" y="433" class="badge" >DIFFERENT HOUSEHOLDS / YEARS</text>
<text x="27" y="465" class="band" >1957–2019 · Fairfax and university</text>
<rect class="card" x="25" y="477" width="516" height="132"/><rect class="family" x="25" y="477" width="6" height="132" rx="3"/><text x="42" y="502" class="person" >James + Gladys → Alice Smith</text><text x="43" y="526" class="key" >WORK</text><text x="115" y="526" class="value" >Alice: Navy Yard admin (family account)</text><text x="43" y="549" class="key" >ASSET</text><text x="115" y="549" class="value" >Smith home sold $360,000 (2010)</text><text x="43" y="572" class="key" >SCHOOL</text><text x="115" y="572" class="value" >Alice: Hayfield + cosmetology (family)</text><rect x="42" y="583" width="180" height="18" rx="9" fill="#eff2ed"/><text x="52" y="596" class="badge" >RECORDS + FAMILY ACCOUNTS</text>
<rect class="card" x="579" y="477" width="516" height="132"/><rect class="family" x="579" y="477" width="6" height="132" rx="3"/><text x="596" y="502" class="person" >Gladys → Alice → Ashley</text><text x="597" y="526" class="key" >WORK</text><text x="669" y="526" class="value" >Three-generation recent path</text><text x="597" y="549" class="key" >ASSET</text><text x="669" y="549" class="value" >No inheritance or net-worth record</text><text x="597" y="572" class="key" >SCHOOL</text><text x="669" y="572" class="value" >Timothy + Ashley: Virginia Tech (family)</text><rect x="596" y="583" width="192" height="18" rx="9" fill="#eff2ed"/><text x="606" y="596" class="badge" >PARENT LINKS; SCHOOL FAMILY</text>
<rect x="25" y="633" width="1070" height="24" rx="7" fill="#eaf0ed"/>
<text x="37" y="650" class="foot" >Teal = record detail  ·  Blue = family account  ·  Ochre = identity or lineage lead. Money fields are different measures, never a wealth curve.</text>
