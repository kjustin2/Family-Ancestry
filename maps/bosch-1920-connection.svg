<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="480" viewBox="0 0 1040 480" role="img" aria-labelledby="title desc"><title id="title">The Bosch and Kramer households in the 1920 census</title><desc id="desc">The 1920 census spans two sheets. Ferdinand and Rose Kramer are on sheet 8A. Rose’s parents Amiel and Hildegard Bosch and the two sons are on sheet 8B. The Bosch couple reported birth in Baden and immigration about 1880; their exact arrival and Hildegard’s maiden name remain open.</desc><rect width="1040" height="480" fill="#f6f3eb"/><rect x="0" y="0" width="12" height="480" fill="#b46827"/><text x="48" y="59" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#163348" >The Bosch link, across a census page break</text><text x="48" y="87" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#52616a" >1920: sheet 8A ends with the parents; sheet 8B continues their household.</text><rect x="48" y="116" width="440" height="76" rx="12" fill="#fff" stroke="#d8dedc"/><rect x="48" y="116" width="8" height="76" rx="4" fill="#b46827"/><text x="70" y="147" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#163348" >Amiel + Hildegard Bosch</text><text x="70" y="173" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#52616a" >Baden-born · reported arrival c. 1880</text><rect x="552" y="116" width="440" height="76" rx="12" fill="#fff" stroke="#d8dedc"/><rect x="552" y="116" width="8" height="76" rx="4" fill="#127f82"/><text x="574" y="147" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#163348" >Ferdinand + Rose A. Kramer</text><text x="574" y="173" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#52616a" >1920 household head + wife</text><path d="M268 192 L268 222 L520 222 L520 245 M772 192 L772 222 L520 222" fill="none" stroke="#85979b" stroke-width="3"/><text x="520" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#52616a" text-anchor="middle">in-laws to Ferdinand = Rose’s parents</text><rect x="48" y="259" width="944" height="76" rx="12" fill="#fff" stroke="#d8dedc"/><rect x="48" y="259" width="8" height="76" rx="4" fill="#127f82"/><text x="70" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#163348" >Ferdinand L. (1913) + Emil Carl (1915)</text><text x="70" y="316" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#52616a" >Sons on 1920 sheet 8B · Hilda joined the household by 1930</text><line x1="520" y1="245" x2="520" y2="259" stroke="#85979b" stroke-width="3"/><text x="48" y="377" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#163348" >Rose’s Bosch surname is named in Emil’s 1941 marriage application.</text><text x="48" y="408" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#52616a" >Greener as Hildegard’s maiden name and an exact immigration date still need records.</text></svg>